name: rename-dept-sales-guide
on:
  push:
    paths:
      - '.github/workflows/rename-dept-sales-guide.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename guide label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'部門販買目安'+", "'前年比部門販買目安'+")
          s=s.replace('/^部門販買目安.*$/m', '/^前年比?部門販買目安.*$/m')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Rename department sales guide label'
          git push