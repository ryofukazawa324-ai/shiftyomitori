name: add-hypothesis-tools-safe
on:
  push:
    paths:
      - '.github/workflows/add-hypothesis-tools-safe.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hypothesis tools safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Add tools inside the existing dailyHypothesis card, after its textarea.
          needle='else h+=`<textarea id="${id}"></textarea>`;h+=`<label class="showLabel"'
          repl='''else{h+=`<textarea id="${id}"></textarea>`;if(id==='dailyHypothesis')h+=`<div id="hypothesisTools" class="saved" style="margin-top:10px"><div class="twoCol"><div><label>前年部門実績（万円）</label><input id="prevDeptSales" type="number" step="0.1" inputmode="decimal"></div><div><label>除外する割合（%）</label><input id="prevDeptPercent" type="number" min="0" max="100" step="1" inputmode="decimal" placeholder="例：60"></div></div><div style="margin-top:9px"><label>補足メモ</label><input id="deptGuideMemo" type="text" placeholder="例：サプライ除く"></div><div id="deptGuidePreview" class="small" style="margin-top:8px"></div></div>`}h+=`<label class="showLabel"'''
          if 'id="hypothesisTools"' not in s:
              if needle not in s: raise SystemExit('daily hypothesis build target not found')
              s=s.replace(needle,repl,1)
          # Bind after edit HTML is built.
          bind="edit.querySelectorAll('[data-report-toggle]').forEach(e=>e.onchange=()=>{setReportIncluded(e.dataset.reportToggle,e.checked);render()});"
          if 'setupHypothesisTools();' not in s:
              if bind not in s: raise SystemExit('build bind target not found')
              s=s.replace(bind,bind+'setupHypothesisTools();',1)
          # Add standalone helper functions before productivity functions.
          anchor='function productivityState()'
          if 'function hypothesisToolKey(' not in s:
              code=r'''function hypothesisToolKey(v=date.value){return `${PREFIX}hypothesisTools:${v}`}
function previousDayValue(){const z=new Date(date.value+'T00:00:00');z.setDate(z.getDate()-1);return iso(z)}
function hypothesisToolState(){let x={prev:'',percent:'',memo:''};try{x={...x,...JSON.parse(localStorage.getItem(hypothesisToolKey())||'{}')}}catch{}if(!String(x.memo||'').trim()){try{const y=JSON.parse(localStorage.getItem(hypothesisToolKey(previousDayValue()))||'{}');if(String(y.memo||'').trim())x.memo=y.memo}catch{}}return x}
function deptGuideText(){const x=hypothesisToolState(),a=Number(x.prev),p=Number(x.percent);if(!Number.isFinite(a)||!Number.isFinite(p)||x.prev===''||x.percent==='')return'';const v=a*(1-Math.max(0,Math.min(100,p))/100),m=String(x.memo||'').trim();return `部門販買目安${Number.isInteger(v)?v:v.toFixed(1)}万${m?`(${m})`:''}`}
function setupHypothesisTools(){const a=$('prevDeptSales'),p=$('prevDeptPercent'),m=$('deptGuideMemo'),r=$('deptGuidePreview');if(!a||!p||!m)return;const x=hypothesisToolState();a.value=x.prev??'';p.value=x.percent??'';m.value=x.memo??'';const upd=()=>{localStorage.setItem(hypothesisToolKey(),JSON.stringify({prev:a.value,percent:p.value,memo:m.value}));const line=deptGuideText();if(r)r.textContent=line||'前年実績から指定％を除いた金額を計算します';const d=data(),ta=$('dailyHypothesis');if(line&&ta&&!String(ta.value||'').includes('部門販買目安')){ta.value=(String(ta.value||'').trim()?String(ta.value).trimEnd()+'\n':'')+line;d.dailyHypothesis=ta.value;localStorage.setItem(dayKey(),JSON.stringify(d));render()}};a.oninput=upd;p.oninput=upd;m.oninput=upd;if(r)r.textContent=deptGuideText()||'前年実績から指定％を除いた金額を計算します'}
'''
              if anchor not in s: raise SystemExit('productivity anchor not found')
              s=s.replace(anchor,code+anchor,1)
          # Make Tokyo the default weather setting without overwriting a saved user location.
          s=s.replace('placeholder="例：東京都府中市"','placeholder="東京都"',1)
          # Existing weather code uses the stored setting; seed Tokyo only when empty, immediately before app init if possible.
          init='date.value=iso(new Date());'
          if "weatherLocation')||'東京都'" not in s and init in s:
              s=s.replace(init,"if(!localStorage.getItem(`${PREFIX}weatherLocation`))localStorage.setItem(`${PREFIX}weatherLocation`,'東京都');"+init,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Add hypothesis sales guide safely'
          git push