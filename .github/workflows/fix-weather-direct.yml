name: Fix weather direct
on:
  push:
    paths:
      - '.github/workflows/fix-weather-direct.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply current hypothesis patch
        run: node patch-hypothesis.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m 'Fix blank-only Tokyo weather autofill'
            git push
          fi
