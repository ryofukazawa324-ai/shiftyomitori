name: monthly-productivity
on:
  push:
    paths:
      - '.github/workflows/apply-monthly-productivity.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add department sales guide
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Add controls immediately below the daily hypothesis textarea when cards are built.
          target="c.appendChild(ta);edit.appendChild(c)"
          repl="""c.appendChild(ta);if(d.id==='dailyHypothesis'){const box=document.createElement('div');box.className='saved';box.style.marginTop='10px';box.innerHTML='<div class=\"twoCol\"><div><label>前年部門実績（万円）</label><input id=\"prevDeptSales\" type=\"number\" step=\"0.1\" inputmode=\"decimal\"></div><div><label>割り算</label><input id=\"prevDeptDivisor\" type=\"number\" step=\"0.1\" inputmode=\"decimal\" placeholder=\"例：1.0\"></div></div><div id=\"deptSalesGuideResult\" class=\"small\" style=\"margin-top:8px\"></div>';c.appendChild(box);setTimeout(setupDeptSalesGuide,0)}edit.appendChild(c)"""
          if target not in s: raise SystemExit('build target not found')
          s=s.replace(target,repl,1)
          # Store per day, calculate, and inject/update only the generated line in hypothesis text.
          anchor="function productivityState()"
          code=r'''function deptGuideKey(){return `${PREFIX}deptGuide:${date.value}`}
function deptGuideState(){let x={prev:'',divisor:''};try{x={...x,...JSON.parse(localStorage.getItem(deptGuideKey())||'{}')}}catch{}return x}
function deptGuideValue(){const x=deptGuideState(),a=+x.prev||0,b=+x.divisor||0;return a&&b?a/b:0}
function applyDeptGuideLine(){const v=deptGuideValue();if(!v)return;const d=data(),line=`部門販買目安：${v.toFixed(1)}万円`,cur=String(d.dailyHypothesis||'');const re=/^部門販買目安：.*$/m;d.dailyHypothesis=re.test(cur)?cur.replace(re,line):(cur.trim()?cur.trimEnd()+'\n'+line:line);localStorage.setItem(dayKey(),JSON.stringify(d));const ta=$('dailyHypothesis');if(ta&&document.activeElement!==ta)ta.value=d.dailyHypothesis;render()}
function setupDeptSalesGuide(){const x=deptGuideState(),a=$('prevDeptSales'),b=$('prevDeptDivisor'),r=$('deptSalesGuideResult');if(!a||!b)return;a.value=x.prev??'';b.value=x.divisor??'';const save=()=>{const n={prev:a.value,divisor:b.value};localStorage.setItem(deptGuideKey(),JSON.stringify(n));const v=deptGuideValue();if(r)r.textContent=v?`部門販買目安：${v.toFixed(1)}万円`:'前年部門実績 ÷ 割り算 の結果を本文へ入れます';if(v)applyDeptGuideLine()};a.oninput=save;b.oninput=save;const v=deptGuideValue();if(r)r.textContent=v?`部門販買目安：${v.toFixed(1)}万円`:'前年部門実績 ÷ 割り算 の結果を本文へ入れます'}
'''
          if anchor not in s: raise SystemExit('function anchor not found')
          s=s.replace(anchor,code+anchor,1)
          # Ensure changing dates refreshes controls after rebuild.
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Add department sales guide to daily hypothesis'
          git push
# trigger department guide 2026-09-30