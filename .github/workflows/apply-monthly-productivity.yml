name: monthly-productivity
on:
  push:
    paths:
      - '.github/workflows/apply-monthly-productivity.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const productivityKey=`${PREFIX}productivity`,productivityHiddenKey=`${PREFIX}productivityHidden`;", "const productivityLegacyKey=`${PREFIX}productivity`,productivityKey=()=>`${PREFIX}productivity:${date.value.slice(0,7)}`,productivityHiddenKey=`${PREFIX}productivityHidden`;")
          s=s.replace("function productivityState(){let x={target:4,current:'',worked:'',planned:'',include:false};try{x={...x,...JSON.parse(localStorage.getItem(productivityKey)||'{}')}}catch{}return x}", "function productivityState(){let x={target:4,current:'',worked:'',planned:'',include:false};try{const k=productivityKey(),v=localStorage.getItem(k);if(v)x={...x,...JSON.parse(v)};else{const old=localStorage.getItem(productivityLegacyKey);if(old){x={...x,...JSON.parse(old)};localStorage.setItem(k,JSON.stringify(x))}}}catch{}return x}")
          s=s.replace("localStorage.setItem(productivityKey,JSON.stringify(x));refreshProductivity()", "localStorage.setItem(productivityKey(),JSON.stringify(x));refreshProductivity()")
          s=s.replace("function load(){header();build();render();updateShift();refreshHypothesisWeather()}", "function load(){header();build();render();updateShift();refreshProductivity();refreshHypothesisWeather()}")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Save productivity by month'
          git push
