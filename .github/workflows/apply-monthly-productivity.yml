name: monthly-productivity
on:
  push:
    paths:
      - '.github/workflows/apply-monthly-productivity.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch current index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          needle=';else h+=`<textarea id="${id}"></textarea>`;h+=\'</div>\'}h+=\'<button id="editCopyBtn"'
          replacement=';else{h+=`<textarea id="${id}"></textarea>`;if(id===\'dailyHypothesis\')h+=`<div class="saved" style="margin-top:10px"><div class="twoCol"><div><label>前年部門実績（万円）</label><input id="prevDeptSales" type="number" step="0.1" inputmode="decimal"></div><div><label>除外する割合（%）</label><input id="prevDeptPercent" type="number" min="0" max="100" step="1" inputmode="decimal" placeholder="例：60"></div></div><div style="margin-top:9px"><label>補足メモ</label><input id="deptGuideMemo" type="text" placeholder="例：サプライ除く"></div><div id="deptSalesGuideResult" class="small" style="margin-top:8px"></div></div>`}h+=\'</div>\'}h+=\'<button id="editCopyBtn"'
          if needle not in s: raise SystemExit('build target not found')
          s=s.replace(needle,replacement,1)
          setup='edit.querySelectorAll(\'[data-cb]\').forEach(e=>e.oninput=()=>{saveCustomBody(+e.dataset.cb,e.value);render()});$("editCopyBtn").onclick=copy}'
          if setup not in s: raise SystemExit('setup target not found')
          s=s.replace(setup,setup.replace('$("editCopyBtn")','setupDeptSalesGuide();$("editCopyBtn")'),1)
          anchor='function productivityState()'
          code=r'''function deptGuideKey(v=date.value){return `${PREFIX}deptGuide:${v}`}
function previousDateString(){const z=new Date(date.value+'T00:00:00');z.setDate(z.getDate()-1);return iso(z)}
function deptGuideState(){let x={prev:'',percent:'',memo:''};try{x={...x,...JSON.parse(localStorage.getItem(deptGuideKey())||'{}')}}catch{}if(!String(x.memo||'').trim()){try{const p=JSON.parse(localStorage.getItem(deptGuideKey(previousDateString()))||'{}');if(String(p.memo||'').trim())x.memo=p.memo}catch{}}return x}
function deptGuideValue(){const x=deptGuideState(),a=+x.prev||0,p=Math.min(100,Math.max(0,+x.percent||0));return a?a*(1-p/100):0}
function deptGuideLine(){const x=deptGuideState(),v=deptGuideValue();if(!v)return'';const memo=String(x.memo||'').trim();return `部門販買目安${Number.isInteger(v)?v:v.toFixed(1)}万${memo?`(${memo})`:''}`}
function applyDeptGuideLine(){const line=deptGuideLine();if(!line)return;const d=data(),cur=String(d.dailyHypothesis||''),re=/^部門販買目安.*$/m;d.dailyHypothesis=re.test(cur)?cur.replace(re,line):(cur.trim()?cur.trimEnd()+'\n'+line:line);localStorage.setItem(dayKey(),JSON.stringify(d));const ta=$('dailyHypothesis');if(ta)ta.value=d.dailyHypothesis;render()}
function setupDeptSalesGuide(){const a=$('prevDeptSales'),p=$('prevDeptPercent'),m=$('deptGuideMemo'),r=$('deptSalesGuideResult');if(!a||!p||!m)return;const x=deptGuideState();a.value=x.prev??'';p.value=x.percent??'';m.value=x.memo??'';const save=()=>{const n={prev:a.value,percent:p.value,memo:m.value};localStorage.setItem(deptGuideKey(),JSON.stringify(n));const line=deptGuideLine();if(r)r.textContent=line||'前年部門実績から指定％を除いた金額を本文へ入れます';if(line)applyDeptGuideLine()};a.oninput=save;p.oninput=save;m.oninput=save;const line=deptGuideLine();if(r)r.textContent=line||'前年部門実績から指定％を除いた金額を本文へ入れます'}
'''
          if anchor not in s: raise SystemExit('anchor not found')
          s=s.replace(anchor,code+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Add department sales guide'
          git push
# exact current build target