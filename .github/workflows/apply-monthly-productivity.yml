name: monthly-productivity
on:
  push:
    paths:
      - '.github/workflows/apply-monthly-productivity.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add report toggles to all sections
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          # Add a persistent report-inclusion map, separate from edit-screen visibility.
          anchor='function cfg()'
          code="""const reportCfgKey=`${PREFIX}reportInclude`;
function reportCfg(){let x={};try{x=JSON.parse(localStorage.getItem(reportCfgKey)||'{}')}catch{}return x}
function reportIncluded(tok){const x=reportCfg();return x[tok]!==false}
function setReportIncluded(tok,v){const x=reportCfg();x[tok]=!!v;localStorage.setItem(reportCfgKey,JSON.stringify(x))}
"""
          if 'const reportCfgKey=' not in s:
              if anchor not in s: raise SystemExit('cfg anchor missing')
              s=s.replace(anchor,code+anchor,1)
          # Standard and custom edit cards: always visible according to existing display setting, plus report checkbox.
          s=s.replace('h+=`<div class="sectionCard"><h3>◆${esc(String(x.title||\'新しい項目\').replace(/^◆+/,\'\'))}</h3><textarea data-cb="${i}">${esc(x.body||\'\')}</textarea></div>`;', 'h+=`<div class="sectionCard"><h3>◆${esc(String(x.title||\'新しい項目\').replace(/^◆+/,\'\'))}</h3><textarea data-cb="${i}">${esc(x.body||\'\')}</textarea><label class="showLabel" style="display:block;margin-top:8px"><input type="checkbox" data-report-toggle="c:${i}" ${reportIncluded(`c:${i}`)?\'checked\':\'\'}> 日報にも記載する</label></div>`;',1)
          old='h+=`<div class="sectionCard"><div class="sectionHead"><h3>◆${esc(title(id))}</h3></div>`;'
          new='h+=`<div class="sectionCard"><div class="sectionHead"><h3>◆${esc(title(id))}</h3></div>`;'
          # Insert checkbox just before each standard card closes.
          oldclose="else h+=`<textarea id=\"${id}\"></textarea>`;h+='</div>'"
          newclose="else h+=`<textarea id=\"${id}\"></textarea>`;h+=`<label class=\"showLabel\" style=\"display:block;margin-top:8px\"><input type=\"checkbox\" data-report-toggle=\"s:${id}\" ${reportIncluded(`s:${id}`)?'checked':''}> 日報にも記載する</label>`;h+='</div>'"
          if oldclose in s: s=s.replace(oldclose,newclose,1)
          else:
              # current guide-patched build may have special dailyHypothesis branch; attach before generic card close
              marker="h+='</div>'}h+='<button id=\"editCopyBtn\""
              repl="h+=`<label class=\"showLabel\" style=\"display:block;margin-top:8px\"><input type=\"checkbox\" data-report-toggle=\"s:${id}\" ${reportIncluded(`s:${id}`)?'checked':''}> 日報にも記載する</label>`;h+='</div>'}h+='<button id=\"editCopyBtn\""
              if marker in s: s=s.replace(marker,repl,1)
              else: raise SystemExit('standard card close target missing')
          # Bind report toggles.
          bind="edit.querySelectorAll('[data-cb]').forEach(e=>e.oninput=()=>{saveCustomBody(+e.dataset.cb,e.value);render()});"
          if "[data-report-toggle]" not in s[s.find('function build()'):s.find('function render()')]:
              if bind not in s: raise SystemExit('bind target missing')
              s=s.replace(bind,bind+"edit.querySelectorAll('[data-report-toggle]').forEach(e=>e.onchange=()=>{setReportIncluded(e.dataset.reportToggle,e.checked);render()});",1)
          # Filter display mode / copy source at render level.
          s=s.replace("if(x&&!x.hidden)o.push('',`◆${String(x.title||'新しい項目').replace(/^◆+/,'')}`,x.body||'');continue", "if(x&&!x.hidden&&reportIncluded(tok))o.push('',`◆${String(x.title||'新しい項目').replace(/^◆+/,'')}`,x.body||'');continue",1)
          s=s.replace("const id=tok.slice(2);if(!visible(id))continue;", "const id=tok.slice(2);if(!visible(id)||!reportIncluded(tok))continue;",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Add per-section report inclusion toggles'
          git push
# all section report toggles v1