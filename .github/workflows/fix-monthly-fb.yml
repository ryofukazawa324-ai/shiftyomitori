name: Exclude paid leave from staff list
on:
  push:
    paths:
      - '.github/workflows/fix-monthly-fb.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add paid leave exclusions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="['休','公','有','年','欠','休み','公休','有休']"
          new="['休','公','有','年','欠','休み','公休','有休','有給','年休','欠勤']"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Exclude paid leave from staff list'
          git push