name: Preserve manually edited staff members
on:
  push:
    paths:
      - '.github/workflows/fix-monthly-fb.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch manual staff override
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function save(){const d=data();legacy.forEach(id=>{const e=$(id);if(e)d[id]=e.value});localStorage.setItem(dayKey(),JSON.stringify(d));render()}"
          new="function save(){const d=data();legacy.forEach(id=>{const e=$(id);if(e)d[id]=e.value});if(document.activeElement&&document.activeElement.id==='staffMembers')d.staffMembersManual=true;localStorage.setItem(dayKey(),JSON.stringify(d));render()}"
          if old not in s: raise SystemExit('save target not found')
          s=s.replace(old,new)
          old2="const d=data();d.staffMembers=members.join('\\n');localStorage.setItem(dayKey(),JSON.stringify(d));"
          new2="const d=data();if(!d.staffMembersManual){d.staffMembers=members.join('\\n');localStorage.setItem(dayKey(),JSON.stringify(d));}"
          if old2 not in s: raise SystemExit('staff autofill target not found')
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Preserve manually edited staff members by date'
          git push