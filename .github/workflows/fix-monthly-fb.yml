name: Cache parsed shift data
on:
  push:
    paths:
      - '.github/workflows/fix-monthly-fb.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache parsed Excel data
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const DB='ShiftSearchDB',STORE='files',REC='currentShift';"
          new="const DB='ShiftSearchDB',STORE='files',REC='currentShift',PARSED='currentShiftParsed';"
          if old not in s: raise SystemExit('db constants target not found')
          s=s.replace(old,new)
          old="async function loadX(){const db=await odb();return new Promise((ok,no)=>{const t=db.transaction(STORE,'readonly'),r=t.objectStore(STORE).get(REC);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)})}"
          new="async function loadX(){const db=await odb();return new Promise((ok,no)=>{const t=db.transaction(STORE,'readonly'),r=t.objectStore(STORE).get(REC);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)})}async function saveParsed(v){const db=await odb();return new Promise((ok,no)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,PARSED);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function loadParsed(){const db=await odb();return new Promise((ok,no)=>{const t=db.transaction(STORE,'readonly'),r=t.objectStore(STORE).get(PARSED);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)})}"
          if old not in s: raise SystemExit('loadX target not found')
          s=s.replace(old,new)
          old="status.textContent=`保存済みシフトを使用中（${dateColumns[0]?.iso||'?'} ～ ${dateColumns.at(-1)?.iso||'?'}）`;updateShift()}"
          new="status.textContent=`保存済みシフトを使用中（${dateColumns[0]?.iso||'?'} ～ ${dateColumns.at(-1)?.iso||'?'}）`;updateShift();return{rows,headerRowIndex,nameColIndex,codeColIndex,dateColumns,fileName:name,savedAt:at}}"
          if old not in s: raise SystemExit('parse return target not found')
          s=s.replace(old,new)
          old="await parse(a,f.name);await saveX(a,f.name);status.textContent="
          new="const parsed=await parse(a,f.name);await saveX(a,f.name);await saveParsed(parsed);status.textContent="
          if old not in s: raise SystemExit('file parse target not found')
          s=s.replace(old,new)
          old="const deferred=async()=>{try{const s=await loadX();if(s)await parse(s.data,s.fileName,s.savedAt)}catch{}};"
          new="const deferred=async()=>{try{const c=await loadParsed();if(c&&c.rows&&c.dateColumns){rows=c.rows;headerRowIndex=c.headerRowIndex;nameColIndex=c.nameColIndex;codeColIndex=c.codeColIndex;dateColumns=c.dateColumns;savedBox.hidden=false;savedName.textContent=c.fileName||'保存済みシフト表';savedDate.textContent=c.savedAt?`保存日時：${new Date(c.savedAt).toLocaleString('ja-JP')}`:'';fileLabel.textContent='シフト表を更新';status.textContent=`保存済みシフトを使用中（${dateColumns[0]?.iso||'?'} ～ ${dateColumns.at(-1)?.iso||'?'}）`;updateShift();return}const x=await loadX();if(x){const parsed=await parse(x.data,x.fileName,x.savedAt);await saveParsed(parsed)}}catch{}};"
          if old not in s: raise SystemExit('deferred target not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Cache parsed shift data for faster startup'
          git push