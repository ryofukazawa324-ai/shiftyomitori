name: Fix daily sales target
on:
  push:
    paths:
      - '.github/workflows/fix-monthly-fb.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use 8.5 hour daily average
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="let h=8;const m=String(selectedShift||'').match(/(\\d+(?:\\.\\d+)?)\\s*(?:h|時間)/i);if(m)h=+m[1];return{x,goal,remainH,remain,need,today:need*h}"
          new="const remainingDays=remainH/8.5;const today=remainingDays?remain/remainingDays:0;return{x,goal,remainH,remain,need,remainingDays,today}"
          if old not in s:
              raise SystemExit('target calculation not found')
          s=s.replace(old,new,1)
          s=s.replace("本日の販買目安：${q.today.toFixed(1)}万円","残り勤務日数目安：${q.remainingDays.toFixed(1)}日（1日8.5時間換算）\\n本日の販買目安：${q.today.toFixed(1)}万円",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Calculate daily sales target with 8.5 hour average'
          git push
# trigger 2026-09-29