name: Fix underscore carryover
on:
  push:
    paths:
      - '.github/workflows/fix-monthly-fb.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Carry headings into blank fields on every date
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          start=s.index('function underscoreHeads(')
          end=s.index('function cfg()',start)
          if start<0 or end<0: raise SystemExit('carryover block missing')
          new=r'''function underscoreHeads(v){return String(v||'').split(/\r?\n/).map(x=>x.trim()).filter(x=>x.startsWith('_')&&x.length>1)}
function previousMonthHeads(){if(!date.value)return{};const dt=new Date(date.value+'T00:00:00'),pm=new Date(dt.getFullYear(),dt.getMonth()-1,1),pfx=`${pm.getFullYear()}-${String(pm.getMonth()+1).padStart(2,'0')}`,out={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith(`${PREFIX}day:${pfx}-`)||k.endsWith(':customBodies')||k.endsWith(':customSections')||k.endsWith(':layoutOrder'))continue;let d={};try{d=JSON.parse(localStorage.getItem(k)||'{}')}catch{};for(const id of legacy){if(id==='staffMembers'||id==='virtualOrder'||id==='salesModels'||id==='bbSurvey')continue;const hs=underscoreHeads(d[id]);if(hs.length)(out[id]??=[]).push(...hs)}const day=k.slice(`${PREFIX}day:`.length);try{const cb=JSON.parse(localStorage.getItem(customBodyKey(day))||'[]');cb.forEach((v,n)=>{const hs=underscoreHeads(v);if(hs.length)(out[`custom:${n}`]??=[]).push(...hs)})}catch{}try{const old=JSON.parse(localStorage.getItem(legacyCustomKey(day))||'[]');old.forEach((x,n)=>{const hs=underscoreHeads(x.body);if(hs.length)(out[`custom:${n}`]??=[]).push(...hs)})}catch{}}for(const key of Object.keys(out))out[key]=[...new Set(out[key])];return out}
function blank(){return{staffMembers:'',dailyTodo:[DEFAULTS.dailyTodo,...weekdays()].join('\n'),earlyTodo:DEFAULTS.earlyTodo,lateTodo:DEFAULTS.lateTodo,beforeGoal:'',virtualOrder:'',salesModels:'',bbSurvey:'',oneWord:'',improve:'',stumble:'',impression:''}}
function data(){const b=blank();let saved={};try{saved=JSON.parse(localStorage.getItem(dayKey())||'{}')}catch{};const d={...b,...saved},h=previousMonthHeads();for(const [id,a] of Object.entries(h)){if(id.startsWith('custom:')||!(id in d)||!a.length)continue;if(!String(saved[id]??'').trim()&&!String(b[id]??'').trim())d[id]=a.join('\n')}return d}
'''
          s=s[:start]+new+s[end:]

          a=s.index('function customBodies(')
          b=s.index('function customs(',a)
          if a<0 or b<0: raise SystemExit('customBodies block missing')
          new2=r'''function customBodies(day=date.value){let a=[];try{a=JSON.parse(localStorage.getItem(customBodyKey(day))||'[]')}catch{};if(!a.length){try{const old=JSON.parse(localStorage.getItem(legacyCustomKey(day))||'[]');if(old.length)a=old.map(x=>x.body||'')}catch{}}if(day===date.value){const h=previousMonthHeads();for(const [k,v] of Object.entries(h))if(k.startsWith('custom:')&&v.length){const n=+k.slice(7);while(a.length<=n)a.push('');if(!String(a[n]||'').trim())a[n]=v.join('\n')}}return a}
'''
          s=s[:a]+new2+s[b:]
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Fix underscore carryover for blank fields on all dates'
          git push