name: Set home screen icon
on:
  push:
    paths:
      - '.github/workflows/fix-monthly-fb.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add home screen icon metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          icon='https://raw.githubusercontent.com/ryofukazawa324-ai/shiftyomitori/d909b77642a4fb5cc676ef944cdcddc3d78e8fd8/apple-touch-icon.png'
          tags=f'<link rel="apple-touch-icon" sizes="180x180" href="{icon}">\n<link rel="icon" type="image/png" href="{icon}">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-title" content="日報作成">\n'
          if 'rel="apple-touch-icon"' in s:
            import re
            s=re.sub(r'<link rel="apple-touch-icon"[^>]*>\s*', '', s)
          if '<head>' not in s: raise SystemExit('head not found')
          s=s.replace('<head>','<head>\n'+tags,1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Set tortoise and hare home screen icon'
          git push