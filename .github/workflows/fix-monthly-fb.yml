name: Include Sun Lichun in staff members
on:
  push:
    paths:
      - '.github/workflows/fix-monthly-fb.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch staff extraction
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const members=[];for(let r=start;r<=end;r++){const row=rows[r]||[],name=clean(row[nameColIndex]),shift=clean(row[di.col]);if(!name||name.includes('茂呂'))continue;if(name.includes(SELF))selectedShift=shift;if(shift&&!['休','公','有','年','欠','休み','公休','有休','有給','年休','欠勤'].includes(shift))members.push(`${name}　${shift}`)}"
          new="const members=[];for(let r=start;r<=end;r++){const row=rows[r]||[],name=clean(row[nameColIndex]),shift=clean(row[di.col]);if(!name||name.includes('茂呂'))continue;if(name.includes(SELF))selectedShift=shift;if(shift&&!['休','公','有','年','欠','休み','公休','有休','有給','年休','欠勤'].includes(shift))members.push(`${name}　${shift}`)}for(let r=headerRowIndex+1;r<rows.length;r++){const row=rows[r]||[],name=clean(row[nameColIndex]),shift=clean(row[di.col]);if(name.includes('孫立淳')&&shift&&!['休','公','有','年','欠','休み','公休','有休','有給','年休','欠勤'].includes(shift)&&!members.some(x=>x.startsWith('孫立淳　')))members.push(`${name}　${shift}`)}"
          if old not in s: raise SystemExit('staff extraction target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Include Sun Lichun in staff members'
          git push