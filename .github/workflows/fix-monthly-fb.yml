name: Fix shift loader startup
on:
  push:
    paths:
      - '.github/workflows/fix-monthly-fb.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix initialization order
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          migration="if(!localStorage.getItem(mainStaffKey)){let hasExisting=false;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(PREFIX+'day:')){hasExisting=true;break}}if(hasExisting)localStorage.setItem(mainStaffKey,DISPLAY)}"
          if migration not in s: raise SystemExit('migration not found')
          s=s.replace(migration+'\n','',1)
          key_end='mainStaffKey=`${PREFIX}mainStaff`;'
          if key_end not in s: raise SystemExit('key declaration not found')
          s=s.replace(key_end,key_end+'\n'+migration,1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Fix shift loader initialization order'
          git push