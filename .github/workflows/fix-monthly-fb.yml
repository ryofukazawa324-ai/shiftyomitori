name: Toggle custom section visibility
on:
  push:
    paths:
      - '.github/workflows/fix-monthly-fb.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visibility toggle for custom sections
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          s=s.replace("a=old.map(x=>({title:String(x.title||'新しい項目').replace(/^◆+/, '')}))","a=old.map(x=>({title:String(x.title||'新しい項目').replace(/^◆+/, ''),hidden:!!x.hidden}))")
          s=s.replace("function saveCustomDefs(a){localStorage.setItem(customDefsKey,JSON.stringify(a.map(x=>({title:String(x.title||'新しい項目').replace(/^◆+/, '')}))))}","function saveCustomDefs(a){localStorage.setItem(customDefsKey,JSON.stringify(a.map(x=>({title:String(x.title||'新しい項目').replace(/^◆+/, ''),hidden:!!x.hidden}))))}")

          s=s.replace("if(tok.startsWith('c:')){const i=+tok.slice(2),x=cs[i];if(!x)continue;h+=`<div class=\"sectionCard\">","if(tok.startsWith('c:')){const i=+tok.slice(2),x=cs[i];if(!x||x.hidden)continue;h+=`<div class=\"sectionCard\">")
          s=s.replace("if(tok.startsWith('c:')){const x=cs[+tok.slice(2)];if(x)o.push('',`◆${String(x.title||'新しい項目').replace(/^◆+/,'')}`,x.body||'');continue}","if(tok.startsWith('c:')){const x=cs[+tok.slice(2)];if(x&&!x.hidden)o.push('',`◆${String(x.title||'新しい項目').replace(/^◆+/,'')}`,x.body||'');continue}")

          old="return`<div class=\"customRow\"><div class=\"sectionNameWrap\"><input data-cn=\"${n}\" value=\"${esc(String(x.title||'新しい項目').replace(/^◆+/,''))}\"></div><div class=\"orderBtns\"><button class=\"orderBtn\" data-move=\"${tok}\" data-dir=\"-1\" ${i===0?'disabled':''}>↑</button><button class=\"orderBtn\" data-move=\"${tok}\" data-dir=\"1\" ${i===a.length-1?'disabled':''}>↓</button></div><button class=\"removeBtn\" data-cr=\"${n}\">削除</button></div>`"
          new="return`<div class=\"customRow\"><div class=\"sectionNameWrap\"><input data-cn=\"${n}\" value=\"${esc(String(x.title||'新しい項目').replace(/^◆+/,''))}\"></div><div class=\"orderBtns\"><button class=\"orderBtn\" data-move=\"${tok}\" data-dir=\"-1\" ${i===0?'disabled':''}>↑</button><button class=\"orderBtn\" data-move=\"${tok}\" data-dir=\"1\" ${i===a.length-1?'disabled':''}>↓</button></div><label class=\"showLabel\"><input type=\"checkbox\" data-cshow=\"${n}\" ${x.hidden?'':'checked'}> 表示</label><button class=\"removeBtn\" data-cr=\"${n}\">削除</button></div>`"
          if old not in s: raise SystemExit('custom row target missing')
          s=s.replace(old,new,1)

          old="$(\"sectionSettings\").querySelectorAll('[data-cn]').forEach(e=>e.oninput=()=>{const x=customDefs();x[+e.dataset.cn].title=String(e.value).replace(/^◆+/,'');saveCustomDefs(x);build();render()});$(\"sectionSettings\").querySelectorAll('[data-move]')"
          new="$(\"sectionSettings\").querySelectorAll('[data-cn]').forEach(e=>e.oninput=()=>{const x=customDefs();x[+e.dataset.cn].title=String(e.value).replace(/^◆+/,'');saveCustomDefs(x);build();render()});$(\"sectionSettings\").querySelectorAll('[data-cshow]').forEach(e=>e.onchange=()=>{const x=customDefs();x[+e.dataset.cshow].hidden=!e.checked;saveCustomDefs(x);build();render()});$(\"sectionSettings\").querySelectorAll('[data-move]')"
          if old not in s: raise SystemExit('custom handler target missing')
          s=s.replace(old,new,1)

          s=s.replace("a.push({title:'新しい項目'});saveCustomDefs(a)","a.push({title:'新しい項目',hidden:false});saveCustomDefs(a)")

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Add visibility toggle for custom sections'
          git push