name: Allow custom sections anywhere
on:
  push:
    paths:
      - '.github/workflows/fix-monthly-fb.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch section ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)},dayKey=()=>`${PREFIX}day:${date.value}`,monthKey=()=>`${PREFIX}month:${date.value.slice(0,7)}`,cfgKey=`${PREFIX}sectionConfig`,orderKey=`${PREFIX}sectionOrder`,customKey=()=>`${dayKey()}:customSections`;"
          new="const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)},dayKey=()=>`${PREFIX}day:${date.value}`,monthKey=()=>`${PREFIX}month:${date.value.slice(0,7)}`,cfgKey=`${PREFIX}sectionConfig`,orderKey=`${PREFIX}sectionOrder`,customKey=()=>`${dayKey()}:customSections`,layoutKey=()=>`${dayKey()}:layoutOrder`;"
          if old not in s: raise SystemExit('key target not found')
          s=s.replace(old,new,1)

          old="function cfg(){let s={};try{s=JSON.parse(localStorage.getItem(cfgKey)||'{}')}catch{};return Object.fromEntries(defs.map(d=>[d[0],{title:String(s[d[0]]?.title||d[1]).replace(/^◆+/,''),hidden:!!s[d[0]]?.hidden}]))}function order(){try{const a=JSON.parse(localStorage.getItem(orderKey)||'[]');return[...a.filter(x=>ids.includes(x)),...ids.filter(x=>!a.includes(x))]}catch{return[...ids]}}function title(id){return cfg()[id]?.title||id}function visible(id){return !cfg()[id]?.hidden}function customs(){try{return JSON.parse(localStorage.getItem(customKey())||'[]')}catch{return[]}}"
          new="function cfg(){let s={};try{s=JSON.parse(localStorage.getItem(cfgKey)||'{}')}catch{};return Object.fromEntries(defs.map(d=>[d[0],{title:String(s[d[0]]?.title||d[1]).replace(/^◆+/,''),hidden:!!s[d[0]]?.hidden}]))}function order(){try{const a=JSON.parse(localStorage.getItem(orderKey)||'[]');return[...a.filter(x=>ids.includes(x)),...ids.filter(x=>!a.includes(x))]}catch{return[...ids]}}function title(id){return cfg()[id]?.title||id}function visible(id){return !cfg()[id]?.hidden}function customs(){try{return JSON.parse(localStorage.getItem(customKey())||'[]')}catch{return[]}}function combinedOrder(){const c=customs(),valid=[...order().map(id=>'s:'+id),...c.map((_,i)=>'c:'+i)];let a=[];try{a=JSON.parse(localStorage.getItem(layoutKey())||'[]')}catch{};a=a.filter(x=>valid.includes(x));return[...a,...valid.filter(x=>!a.includes(x))]}function saveCombined(a){localStorage.setItem(layoutKey(),JSON.stringify(a));localStorage.setItem(orderKey,JSON.stringify(a.filter(x=>x.startsWith('s:')).map(x=>x.slice(2))))}"
          if old not in s: raise SystemExit('helper target not found')
          s=s.replace(old,new,1)

          start=s.index('function build(){')
          end=s.index('function render(){',start)
          if start<0 or end<0: raise SystemExit('build block not found')
          build="""function build(){const d=data(),cs=customs();let h='';for(const tok of combinedOrder()){if(tok.startsWith('c:')){const i=+tok.slice(2),x=cs[i];if(!x)continue;h+=`<div class=\"sectionCard\"><h3>◆${esc(String(x.title||'新しい項目').replace(/^◆+/,''))}</h3><textarea data-cb=\"${i}\">${esc(x.body||'')}</textarea></div>`;continue}const id=tok.slice(2);if(!visible(id))continue;if(id==='earlyTodo'&&!selectedShift.includes('早'))continue;if(id==='lateTodo'&&!isLateShift(selectedShift))continue;h+=`<div class=\"sectionCard\"><div class=\"sectionHead\"><h3>◆${esc(title(id))}</h3></div>`;if(id==='sales')h+=`<div class=\"twoCol\"><div><div class=\"small\">仮想受注込 → 万円</div><input id=\"virtualOrder\" type=\"number\"></div><div><div class=\"small\">販買商品型番</div><textarea id=\"salesModels\"></textarea></div></div>`;else h+=`<textarea id=\"${id}\"></textarea>`;h+='</div>'}h+='<button id=\"editCopyBtn\" class=\"copyBtn\">全文をコピー</button>';edit.innerHTML=h;legacy.forEach(id=>{const e=$(id);if(e){e.value=d[id]??'';e.oninput=save}});if($(\"monthlyGoal\")){ $(\"monthlyGoal\").value=localStorage.getItem(monthKey())??DEFAULTS.monthlyGoal;$(\"monthlyGoal\").oninput=()=>{localStorage.setItem(monthKey(),$(\"monthlyGoal\").value);render()}}edit.querySelectorAll('[data-cb]').forEach(e=>e.oninput=()=>{const a=customs();a[+e.dataset.cb].body=e.value;localStorage.setItem(customKey(),JSON.stringify(a));render()});$(\"editCopyBtn\").onclick=copy}\n"""
          s=s[:start]+build+s[end:]

          start=s.index('function render(){')
          end=s.index('function settings(){',start)
          if start<0 or end<0: raise SystemExit('render block not found')
          render="""function render(){const d=data(),dt=new Date(date.value+'T00:00:00'),o=[`${dt.getMonth()+1}月${dt.getDate()}日　ミッテン府中店　情報部門　${DISPLAY}`],cs=customs();const val=id=>id==='monthlyGoal'?(localStorage.getItem(monthKey())??DEFAULTS.monthlyGoal):id==='sales'?`　仮想受注込　　　→　${d.virtualOrder||''}万円\\n　販買商品型番　→　${d.salesModels||''}`:id==='bbSurvey'?`${d.bbSurvey||''}件`:d[id]||'';for(const tok of combinedOrder()){if(tok.startsWith('c:')){const x=cs[+tok.slice(2)];if(x)o.push('',`◆${String(x.title||'新しい項目').replace(/^◆+/,'')}`,x.body||'');continue}const id=tok.slice(2);if(!visible(id))continue;if(id==='earlyTodo'&&!selectedShift.includes('早'))continue;if(id==='lateTodo'&&!isLateShift(selectedShift))continue;o.push('',`◆${title(id)}`,val(id))}$(\"viewText\").textContent=o.join('\\n').trim()}\n"""
          s=s[:start]+render+s[end:]

          start=s.index('function settings(){')
          end=s.index('$("addSectionFromSettingsBtn").onclick=',start)
          if start<0 or end<0: raise SystemExit('settings block not found')
          settings="""function settings(){const c=cfg(),cs=customs(),a=combinedOrder();$(\"sectionSettings\").innerHTML=a.map((tok,i)=>{if(tok.startsWith('c:')){const n=+tok.slice(2),x=cs[n];if(!x)return'';return`<div class=\"customRow\"><div class=\"sectionNameWrap\"><input data-cn=\"${n}\" value=\"${esc(String(x.title||'新しい項目').replace(/^◆+/,''))}\"></div><div class=\"orderBtns\"><button class=\"orderBtn\" data-move=\"${tok}\" data-dir=\"-1\" ${i===0?'disabled':''}>↑</button><button class=\"orderBtn\" data-move=\"${tok}\" data-dir=\"1\" ${i===a.length-1?'disabled':''}>↓</button></div><button class=\"removeBtn\" data-cr=\"${n}\">削除</button></div>`}const id=tok.slice(2);return`<div class=\"settingsRow\"><div class=\"sectionNameWrap\"><input data-name=\"${id}\" value=\"${esc(c[id].title)}\"></div><div class=\"orderBtns\"><button class=\"orderBtn\" data-move=\"${tok}\" data-dir=\"-1\" ${i===0?'disabled':''}>↑</button><button class=\"orderBtn\" data-move=\"${tok}\" data-dir=\"1\" ${i===a.length-1?'disabled':''}>↓</button></div><label class=\"showLabel\"><input type=\"checkbox\" data-show=\"${id}\" ${c[id].hidden?'':'checked'}> 表示</label></div>`}).join('');$(\"sectionSettings\").querySelectorAll('[data-name]').forEach(e=>e.oninput=()=>{const x=cfg();x[e.dataset.name].title=String(e.value).replace(/^◆+/,'');localStorage.setItem(cfgKey,JSON.stringify(x));build();render()});$(\"sectionSettings\").querySelectorAll('[data-show]').forEach(e=>e.onchange=()=>{const x=cfg();x[e.dataset.show].hidden=!e.checked;localStorage.setItem(cfgKey,JSON.stringify(x));build();render()});$(\"sectionSettings\").querySelectorAll('[data-cn]').forEach(e=>e.oninput=()=>{const x=customs();x[+e.dataset.cn].title=String(e.value).replace(/^◆+/,'');localStorage.setItem(customKey(),JSON.stringify(x));build();render()});$(\"sectionSettings\").querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>moveAny(b.dataset.move,+b.dataset.dir));$(\"sectionSettings\").querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>removeCustom(+b.dataset.cr))}\nfunction moveAny(tok,d){const a=combinedOrder(),i=a.indexOf(tok),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];saveCombined(a);settings();build();render()}\nfunction removeCustom(n){const x=customs();x.splice(n,1);localStorage.setItem(customKey(),JSON.stringify(x));const a=combinedOrder().filter(t=>t!==`c:${n}`).map(t=>t.startsWith('c:')&&+t.slice(2)>n?`c:${+t.slice(2)-1}`:t);saveCombined(a);settings();build();render()}\n"""
          s=s[:start]+settings+s[end:]

          old='$("addSectionFromSettingsBtn").onclick=()=>{const a=customs();a.push({title:\'新しい項目\',body:\'\'});localStorage.setItem(customKey(),JSON.stringify(a));settings();build();render()};'
          new='$("addSectionFromSettingsBtn").onclick=()=>{const a=customs();a.push({title:\'新しい項目\',body:\'\'});localStorage.setItem(customKey(),JSON.stringify(a));const x=combinedOrder();const tok=`c:${a.length-1}`;if(!x.includes(tok))x.push(tok);saveCombined(x);settings();build();render()};'
          if old not in s: raise SystemExit('add target not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Allow custom sections to move among all sections'
          git push