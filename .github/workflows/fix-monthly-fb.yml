name: Fix previous-day underscore carryover
on:
  push:
    paths:
      - '.github/workflows/fix-monthly-fb.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix carryover logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function underscoreHeads(v)')
          end=s.index('function cfg()', start)
          replacement=r'''function underscoreHeads(v){return String(v||'').split(/\r?\n/).map(x=>x.trim()).filter(x=>x.startsWith('_')&&x.length>1)}
function previousDayHeads(){
  if(!date.value)return{};
  const dt=new Date(date.value+'T00:00:00');dt.setDate(dt.getDate()-1);const prev=iso(dt),out={};
  let d={};try{d=JSON.parse(localStorage.getItem(`${PREFIX}day:${prev}`)||'{}')}catch{}
  for(const id of legacy){
    if(id==='staffMembers'||id==='virtualOrder'||id==='salesModels'||id==='bbSurvey')continue;
    const hs=underscoreHeads(d[id]);if(hs.length)out[id]=[...new Set(hs)];
  }
  try{const cb=JSON.parse(localStorage.getItem(customBodyKey(prev))||'[]');cb.forEach((v,n)=>{const hs=underscoreHeads(v);if(hs.length)out[`custom:${n}`]=[...new Set(hs)]})}catch{}
  return out;
}
function blank(){return{staffMembers:'',dailyTodo:[DEFAULTS.dailyTodo,...weekdays()].join('\n'),earlyTodo:DEFAULTS.earlyTodo,lateTodo:DEFAULTS.lateTodo,beforeGoal:'',dailyHypothesis:'',virtualOrder:'',salesModels:'',bbSurvey:'',oneWord:'',improve:'',stumble:'',impression:''}}
function data(){let d=blank();let saved={};try{saved=JSON.parse(localStorage.getItem(dayKey())||'{}');d={...d,...saved}}catch{}const h=previousDayHeads();for(const [id,a] of Object.entries(h)){if(id.startsWith('custom:')||!(id in d)||!a.length)continue;const hasSaved=Object.prototype.hasOwnProperty.call(saved,id)&&String(saved[id]??'').trim();if(!hasSaved&&!String(d[id]||'').trim())d[id]=a.join('\n')}return d}
'''
          s=s[:start]+replacement+s[end:]
          old="if(day===date.value){const h=previousMonthHeads();for(const [k,v] of Object.entries(h))if(k.startsWith('custom:')){const n=+k.slice(7);while(a.length<=n)a.push('');if(!String(a[n]||'').trim()&&v.length)a[n]=v.join('\\n')}}"
          new="if(day===date.value){const h=previousDayHeads();for(const [k,v] of Object.entries(h))if(k.startsWith('custom:')){const n=+k.slice(7);while(a.length<=n)a.push('');if(!String(a[n]||'').trim()&&v.length)a[n]=v.join('\\n')}}"
          if old not in s: raise SystemExit('custom carryover block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Use previous day only for underscore carryover'
          git push