name: Add worked hour quick buttons
on:
  push:
    paths:
      - '.github/workflows/fix-monthly-fb.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old='<div><label>勤務済み時間</label><input id="workedHours" type="number" step="0.1" inputmode="decimal"></div>'
          new='''<div><label>勤務済み時間</label><input id="workedHours" type="number" step="0.1" inputmode="decimal"><div id="workedHourQuick" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px"><button class="orderBtn workedHourAdd" type="button" data-hours="7">＋7</button><button class="orderBtn workedHourAdd" type="button" data-hours="8">＋8</button><button class="orderBtn workedHourAdd" type="button" data-hours="9">＋9</button><button class="orderBtn workedHourAdd" type="button" data-hours="10">＋10</button></div></div>'''
          if 'id="workedHourQuick"' not in s:
              if old not in s: raise SystemExit('workedHours field not found')
              s=s.replace(old,new,1)
          oldfn="function setupProductivity(){refreshProductivity();['targetProductivity','currentProductivity','workedHours','plannedHours'].forEach(id=>{if($(id))$(id).oninput=saveProductivity});if($('includeProductivityInReport'))$('includeProductivityInReport').onchange=saveProductivity;if($('toggleProductivityGuide'))$('toggleProductivityGuide').onclick=()=>{localStorage.setItem(productivityHiddenKey,localStorage.getItem(productivityHiddenKey)==='1'?'0':'1');refreshProductivity()}}"
          newfn="function setupProductivity(){refreshProductivity();['targetProductivity','currentProductivity','workedHours','plannedHours'].forEach(id=>{if($(id))$(id).oninput=saveProductivity});document.querySelectorAll('.workedHourAdd').forEach(b=>b.onclick=()=>{const e=$('workedHours');e.value=(+(e.value||0)+(+b.dataset.hours||0));saveProductivity()});if($('includeProductivityInReport'))$('includeProductivityInReport').onchange=saveProductivity;if($('toggleProductivityGuide'))$('toggleProductivityGuide').onclick=()=>{localStorage.setItem(productivityHiddenKey,localStorage.getItem(productivityHiddenKey)==='1'?'0':'1');refreshProductivity()}}"
          if oldfn not in s: raise SystemExit('setupProductivity not found')
          s=s.replace(oldfn,newfn,1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Add 7 8 9 10 hour quick add buttons'
          git push