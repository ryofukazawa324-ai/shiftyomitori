name: Fix underscore carryover
on:
  push:
    paths:
      - '.github/workflows/patch-autoupdate.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch carryover logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old="function carryHeadsIntoBlank(b){if(!date.value)return b;const day=+date.value.slice(8,10);if(day>1)return b;const h=previousMonthHeads();for(const [id,a] of Object.entries(h))if(!id.startsWith('custom:')&&id in b&&a.length)b[id]=[b[id],...a].filter(Boolean).join('\\n');return b}function blank(){return carryHeadsIntoBlank({staffMembers:'',dailyTodo:[DEFAULTS.dailyTodo,...weekdays()].join('\\n'),earlyTodo:DEFAULTS.earlyTodo,lateTodo:DEFAULTS.lateTodo,beforeGoal:'',virtualOrder:'',salesModels:'',bbSurvey:'',oneWord:'',improve:'',stumble:'',impression:''})}function data(){try{return{...blank(),...JSON.parse(localStorage.getItem(dayKey())||'{}')}}catch{return blank()}}"
          new="function blank(){return{staffMembers:'',dailyTodo:[DEFAULTS.dailyTodo,...weekdays()].join('\\n'),earlyTodo:DEFAULTS.earlyTodo,lateTodo:DEFAULTS.lateTodo,beforeGoal:'',virtualOrder:'',salesModels:'',bbSurvey:'',oneWord:'',improve:'',stumble:'',impression:''}}function data(){let d=blank();try{d={...d,...JSON.parse(localStorage.getItem(dayKey())||'{}')}}catch{}const h=previousMonthHeads();for(const [id,a] of Object.entries(h)){if(id.startsWith('custom:')||!(id in d)||!a.length)continue;if(!String(d[id]||'').trim())d[id]=a.join('\\n')}return d}"
          if old not in s: raise SystemExit('carryover block not found')
          s=s.replace(old,new,1)

          old="function customBodies(day=date.value){let a=[];try{a=JSON.parse(localStorage.getItem(customBodyKey(day))||'[]')}catch{};if(!a.length){try{const old=JSON.parse(localStorage.getItem(legacyCustomKey(day))||'[]');if(old.length){a=old.map(x=>x.body||'');localStorage.setItem(customBodyKey(day),JSON.stringify(a))}}catch{}if(day===date.value&&+day.slice(8,10)===1){const h=previousMonthHeads();for(const [k,v] of Object.entries(h))if(k.startsWith('custom:')){const n=+k.slice(7);while(a.length<=n)a.push('');if(!a[n]&&v.length)a[n]=v.join('\\n')}}}return a}"
          new="function customBodies(day=date.value){let a=[];try{a=JSON.parse(localStorage.getItem(customBodyKey(day))||'[]')}catch{};if(!a.length){try{const old=JSON.parse(localStorage.getItem(legacyCustomKey(day))||'[]');if(old.length){a=old.map(x=>x.body||'');localStorage.setItem(customBodyKey(day),JSON.stringify(a))}}catch{}}if(day===date.value){const h=previousMonthHeads();for(const [k,v] of Object.entries(h))if(k.startsWith('custom:')){const n=+k.slice(7);while(a.length<=n)a.push('');if(!String(a[n]||'').trim()&&v.length)a[n]=v.join('\\n')}}return a}"
          if old not in s: raise SystemExit('custom carryover block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Fix underscore carryover for blank fields on all dates'
          git push