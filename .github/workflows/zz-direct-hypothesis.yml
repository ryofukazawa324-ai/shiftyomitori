name: zz-direct-hypothesis
on:
  push:
    paths:
      - 'patch-hypothesis.js'
      - '.github/workflows/zz-direct-hypothesis.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node patch-hypothesis.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add safe hypothesis guide and weather"
            git push
          fi
