name: Apply productivity and hypothesis final
on:
  push:
    paths: ['.github/workflows/apply-productivity-hypothesis-final.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          # daily hypothesis as a normal configurable section
          old='["beforeGoal","出勤前目標","text"],["sales","販買実績","sales"]'
          new='["beforeGoal","出勤前目標","text"],["dailyHypothesis","本日の仮説","text"],["sales","販買実績","sales"]'
          if '"dailyHypothesis","本日の仮説"' not in s:
              assert old in s, 'defs marker missing'
              s=s.replace(old,new,1)
          old='"lateTodo","beforeGoal","virtualOrder"'
          if '"lateTodo","beforeGoal","dailyHypothesis","virtualOrder"' not in s:
              assert old in s, 'legacy marker missing'
              s=s.replace(old,'"lateTodo","beforeGoal","dailyHypothesis","virtualOrder"',1)
          # productivity UI
          marker='  <button id="monthlyFbBtn" class="monthlyFbBtn" type="button">FB相談</button>'
          if 'id="productivityGuide"' not in s:
              assert marker in s, 'monthly FB marker missing'
              ui='''  <div id="productivityGuide" class="sectionCard"><div class="sectionHead"><h3>◆生産性・販買目標</h3><button id="productivityToggle" class="orderBtn" type="button">非表示</button></div><div id="productivityContent"><div class="twoCol"><div><label>目標生産性（万円/時間）</label><input id="prodTarget" type="number" step="0.1" inputmode="decimal"></div><div><label>現状生産性（万円/時間）</label><input id="prodCurrent" type="number" step="0.1" inputmode="decimal"></div><div><label>勤務済み時間</label><input id="prodWorked" type="number" step="0.1" inputmode="decimal"></div><div><label>月間勤務予定時間</label><input id="prodPlanned" type="number" step="0.1" inputmode="decimal"><div class="small">シフト表から取れない場合は手入力</div></div></div><div id="prodResult" class="saved" style="margin-top:12px"></div><label class="showLabel"><input id="prodInclude" type="checkbox"> 日報の表示・コピーにも記載する</label></div></div>\n'''
              s=s.replace(marker,ui+marker,1)
          # JS functions before header
          marker2='function header(){'
          if 'function prodCalc()' not in s:
              assert marker2 in s, 'header marker missing'
              js=r'''const PRODKEY=`${PREFIX}productivityGuide`,PRODHIDE=`${PREFIX}productivityGuideHidden`;
function prodState(){let x={target:4,current:'',worked:'',planned:'',include:false};try{x={...x,...JSON.parse(localStorage.getItem(PRODKEY)||'{}')}}catch{}return x}
function prodCalc(){const x=prodState(),t=+x.target||0,c=+x.current||0,w=+x.worked||0,p=+x.planned||0;if(!t||!p)return null;const goal=t*p,now=c*w,rh=Math.max(0,p-w),remain=Math.max(0,goal-now),need=rh?remain/rh:0;let hours=8;const sm=String(selectedShift||'').match(/(\d+(?:\.\d+)?)\s*(?:h|時間)/i);if(sm)hours=+sm[1];return{x,goal,now,rh,remain,need,hours,today:need*hours}}
function prodText(){const q=prodCalc();if(!q)return'';return `目標生産性：${q.x.target}万円/時間\n月間販買目標：${q.goal.toFixed(1)}万円\n現状生産性：${q.x.current||0}万円/時間\n目標まで残り：${q.remain.toFixed(1)}万円\n残り${q.rh.toFixed(1)}時間で必要：${q.need.toFixed(2)}万円/時間\n本日の販買目安：${q.today.toFixed(1)}万円`}
function prodRender(){const x=prodState();[['prodTarget',x.target],['prodCurrent',x.current],['prodWorked',x.worked],['prodPlanned',x.planned]].forEach(([id,v])=>{const e=$(id);if(e&&document.activeElement!==e)e.value=v??''});if($('prodInclude'))$('prodInclude').checked=!!x.include;if($('prodResult'))$('prodResult').textContent=prodText()||'目標生産性と勤務時間を入力すると、今日の販買目安を計算します。';const hidden=localStorage.getItem(PRODHIDE)==='1';if($('productivityContent'))$('productivityContent').hidden=hidden;if($('productivityToggle'))$('productivityToggle').textContent=hidden?'表示':'非表示'}
function prodSave(){const x={target:+($('prodTarget')?.value||0),current:+($('prodCurrent')?.value||0),worked:+($('prodWorked')?.value||0),planned:+($('prodPlanned')?.value||0),include:!!$('prodInclude')?.checked};localStorage.setItem(PRODKEY,JSON.stringify(x));prodRender();render()}
function prodSetup(){prodRender();['prodTarget','prodCurrent','prodWorked','prodPlanned'].forEach(id=>{const e=$(id);if(e)e.addEventListener('input',prodSave)});if($('prodInclude'))$('prodInclude').addEventListener('change',prodSave);if($('productivityToggle'))$('productivityToggle').onclick=()=>{localStorage.setItem(PRODHIDE,localStorage.getItem(PRODHIDE)==='1'?'0':'1');prodRender()}}
'''
              s=s.replace(marker2,js+marker2,1)
          # setup
          if 'prodSetup();restoreSavedWorkbook();' not in s:
              assert 'restoreSavedWorkbook();' in s, 'restore marker missing'
              s=s.replace('restoreSavedWorkbook();','prodSetup();restoreSavedWorkbook();',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add productivity guide and daily hypothesis'
          git push
