<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>日報ダッシュボード</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{width:min(760px,calc(100% - 24px));margin:22px auto}.card,.section{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px}.card{box-shadow:0 8px 28px rgba(0,0,0,.07)}h1{margin:0 0 5px;font-size:26px}.sub,.small{color:#6b7280;font-size:12px;line-height:1.55}.dateRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin:16px 0}.dateRow input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}button,.fileBtn{border:0;border-radius:10px;padding:12px 14px;font-weight:700;cursor:pointer;background:#111827;color:#fff;text-align:center}.dateRow button{width:auto}.header{background:#111827;color:#fff;padding:13px 15px;border-radius:12px;font-weight:800}.shift{margin:7px 0 12px;color:#6b7280;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.tabs button{background:#eef2f7;color:#111827;padding:11px 6px}.tabs button.active{background:#111827;color:#fff}.section{margin:12px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.head h3{margin:0;font-size:17px}.plus{width:34px;height:34px;padding:0;background:#eef2f7;color:#111827;font-size:20px}textarea,input[type=text],input[type=number]{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:11px;font:inherit}textarea{min-height:84px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.view{white-space:pre-wrap;line-height:1.75;border:1px solid #e5e7eb;border-radius:12px;padding:15px}.copy{width:100%;margin-top:10px}.setting{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.setting:last-child{border-bottom:0}.setting input[type=text]{padding:9px}.setting label{font-size:13px;white-space:nowrap}.custom .remove{background:#fff1f2;color:#b91c1c;width:auto;padding:8px 10px}.customTitle{margin-bottom:7px;font-weight:700}.fileBtn{display:block;background:#eef2f7;color:#111827;margin-top:8px}input[type=file]{display:none}.danger{background:#fff;color:#b91c1c;border:1px solid #fecaca;width:100%;margin-top:10px}@media(max-width:560px){.two{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(3,1fr)}h1{font-size:23px}}
</style>
</head><body><main class="wrap"><section class="card">
<h1>日報ダッシュボード</h1><div class="sub">日付ごとに編集・保存。◆項目名も自由に変更できます。</div>
<div class="dateRow"><div><label>日付</label><input id="targetDate" type="date"></div><button id="todayBtn">今日</button></div>
<div id="reportHeader" class="header"></div><div id="shiftInfo" class="shift">シフト：読み込み待ち</div>
<div class="tabs"><button id="viewBtn">表示モード</button><button id="editBtn" class="active">編集モード</button><button id="sectionBtn">項目変更</button></div>
<section id="viewMode" hidden><div id="viewText" class="view"></div><button id="copyBtn" class="copy">全文をコピー</button></section>
<section id="sectionMode" hidden><div class="section"><h3>◆項目変更モード</h3><p class="small">項目名と表示/非表示を変更できます。入力済み本文は消えません。</p><div id="settings"></div><button id="resetNames" class="copy">項目名を初期状態に戻す</button></div></section>
<section id="editMode"></section>
<div class="section"><h3>シフト表</h3><div class="small" id="savedInfo">登録済みシフトがあれば自動で使用します。</div><label class="fileBtn" for="excelFile">シフト表を登録・更新</label><input id="excelFile" type="file" accept=".xlsx,.xls,.xlsm"></div>
<button id="deleteBtn" class="danger">日報の保存データを削除</button>
</section></main>
<script>
(()=>{
const SHEET_NAME="3）入力用",SELF="深澤",DISPLAY="深澤椋",PREFIX="workReport:";
const DEFAULTS={monthlyGoal:"販買以外の業務を部門でできるようにしていく\nお客様に向かう行動を常にしタイミングに振り回されないようにする",dailyTodo:"pos点検、退勤時AV情報POS締め",earlyTodo:"ゲーム在庫確認、展示デモオンPCコーナーからゲームコーナー前レジ横のモニター左右まで\npcコーナーpop更新、古物確認"};
const defs=[
["staffMembers","出勤メンバー","text"],["monthlyGoal","今月目標","month"],["dailyTodo","本日のやること","text"],["earlyTodo","早番todo","text"],["beforeGoal","出勤前目標","text"],["sales","販買実績","sales"],["bbSurvey","BBアンケート","text"],["oneWord","ヒトコト所感","text"],["improve","改善期待行動","text"],["stumble","まごついたところ","text"],["impression","所感","text"]];
const legacyFields=["staffMembers","dailyTodo","earlyTodo","beforeGoal","virtualOrder","salesModels","bbSurvey","oneWord","improve","stumble","impression"];
const $=id=>document.getElementById(id),date=$('targetDate'),edit=$('editMode'),view=$('viewMode'),sec=$('sectionMode');let selectedShift="";
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const dayKey=()=>`${PREFIX}day:${date.value}`,monthKey=()=>`${PREFIX}month:${date.value.slice(0,7)}`,cfgKey=`${PREFIX}sectionConfig`,customKey=()=>`${dayKey()}:customSections`;
function cfg(){try{return {...Object.fromEntries(defs.map(d=>[d[0],{title:d[1],visible:true}])),...JSON.parse(localStorage.getItem(cfgKey)||'{}')}}catch{return Object.fromEntries(defs.map(d=>[d[0],{title:d[1],visible:true}]))}}
function title(id){return cfg()[id]?.title||defs.find(d=>d[0]===id)?.[1]||id}function visible(id){return cfg()[id]?.visible!==false}
function weekdays(){const d=new Date(date.value+'T00:00:00'),w=d.getDay(),a=[];if(w===1)a.push('自主棚');if(w===3)a.push('ゲームダミー準備確認');if(w===4)a.push('ゲーム発売できるように','OODA更新');if(w===5)a.push('18:30くらいから上貼りがある時ある','MK調査');if(w===6)a.push('MK調査','BB濱崎シート確認');return a}
function blank(){return{staffMembers:'',dailyTodo:[DEFAULTS.dailyTodo,...weekdays()].join('\n'),earlyTodo:DEFAULTS.earlyTodo,beforeGoal:'',virtualOrder:'',salesModels:'',bbSurvey:'',oneWord:'',improve:'',stumble:'',impression:''}}
function data(){try{return{...blank(),...JSON.parse(localStorage.getItem(dayKey())||'{}')}}catch{return blank()}}
function save(){const d=data();legacyFields.forEach(id=>{const e=$(id);if(e)d[id]=e.value});localStorage.setItem(dayKey(),JSON.stringify(d));render()}
function customs(){try{return JSON.parse(localStorage.getItem(customKey())||'[]')}catch{return[]}}function saveCustom(a){localStorage.setItem(customKey(),JSON.stringify(a));build();render()}
function box(id,type){if(!visible(id))return '';const h=`<div class="head"><h3>◆${esc(title(id))}</h3><button class="plus" data-add>＋</button></div>`;if(type==='sales')return `<div class="section" data-section="${id}">${h}<div class="two"><div><div class="small">仮想受注込 → 万円</div><input id="virtualOrder" type="number"></div><div><div class="small">販買商品型番</div><textarea id="salesModels"></textarea></div></div></div>`;return `<div class="section" data-section="${id}">${h}<textarea id="${id}"></textarea>${id==='monthlyGoal'?'<div class="small">月ごとに保存します。</div>':''}</div>`}
function build(){edit.innerHTML=defs.map(d=>box(d[0],d[2])).join('')+customs().map((x,i)=>`<div class="section custom"><div class="head"><input class="customTitle" data-ct="${i}" value="${esc(x.title||'新しい項目')}"><button class="remove" data-rm="${i}">削除</button></div><textarea data-cb="${i}">${esc(x.body||'')}</textarea></div>`).join('')+`<button id="editCopyBtn" class="copy">全文をコピー</button>`;loadValues();edit.querySelectorAll('[data-add]').forEach(b=>b.onclick=addCustom);legacyFields.forEach(id=>{const e=$(id);if(e)e.oninput=save});if($('monthlyGoal'))$('monthlyGoal').oninput=()=>{localStorage.setItem(monthKey(),$('monthlyGoal').value);render()};edit.querySelectorAll('[data-ct]').forEach(e=>e.oninput=()=>{const a=customs();a[+e.dataset.ct].title=e.value;localStorage.setItem(customKey(),JSON.stringify(a));render()});edit.querySelectorAll('[data-cb]').forEach(e=>e.oninput=()=>{const a=customs();a[+e.dataset.cb].body=e.value;localStorage.setItem(customKey(),JSON.stringify(a));render()});edit.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const a=customs();a.splice(+b.dataset.rm,1);saveCustom(a)});$('editCopyBtn').onclick=copy}
function loadValues(){const d=data();legacyFields.forEach(id=>{const e=$(id);if(e)e.value=d[id]??''});if($('monthlyGoal'))$('monthlyGoal').value=localStorage.getItem(monthKey())??DEFAULTS.monthlyGoal}
function addCustom(){const a=customs();a.push({title:'新しい項目',body:''});saveCustom(a)}
function render(){const d=data(),dt=new Date(date.value+'T00:00:00');let out=[`${dt.getMonth()+1}月${dt.getDate()}日　ミッテン府中店　情報部門　${DISPLAY}`,''];const val=id=>{if(id==='monthlyGoal')return localStorage.getItem(monthKey())??DEFAULTS.monthlyGoal;if(id==='sales')return `　仮想受注込　　　→　${d.virtualOrder||''}万円\n　販買商品型番　→　${d.salesModels||''}`;return d[id]||''};defs.forEach(([id])=>{if(!visible(id))return;if(id==='earlyTodo'&&!selectedShift.includes('早'))return;out.push(`◆${title(id)}`,val(id),'')});customs().forEach(x=>out.push(`◆${x.title||'新しい項目'}`,x.body||'',''));$('viewText').textContent=out.join('\n').trim()}
function settings(){const c=cfg();$('settings').innerHTML=defs.map(([id,n])=>`<div class="setting"><input type="text" data-name="${id}" value="${esc(c[id]?.title||n)}"><label><input type="checkbox" data-vis="${id}" ${c[id]?.visible===false?'':'checked'}> 表示</label></div>`).join('');$('settings').querySelectorAll('[data-name]').forEach(e=>e.oninput=()=>{const x=cfg();x[e.dataset.name]={...(x[e.dataset.name]||{}),title:e.value};localStorage.setItem(cfgKey,JSON.stringify(x));build();render()});$('settings').querySelectorAll('[data-vis]').forEach(e=>e.onchange=()=>{const x=cfg();x[e.dataset.vis]={...(x[e.dataset.vis]||{}),visible:e.checked};localStorage.setItem(cfgKey,JSON.stringify(x));build();render()})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function header(){$('reportHeader').textContent=date.value?`${new Date(date.value+'T00:00:00').getMonth()+1}月${new Date(date.value+'T00:00:00').getDate()}日　ミッテン府中店　情報部門　${DISPLAY}`:''}
function load(){header();build();render();updateShift()}
async function copy(){render();try{await navigator.clipboard.writeText($('viewText').textContent);alert('全文をコピーしました')}catch{alert('コピーできませんでした。表示モードから長押しコピーしてください。')}}
function mode(m){view.hidden=m!=='view';edit.hidden=m!=='edit';sec.hidden=m!=='section';$('viewBtn').classList.toggle('active',m==='view');$('editBtn').classList.toggle('active',m==='edit');$('sectionBtn').classList.toggle('active',m==='section');if(m==='view')render();if(m==='section')settings()}
$('viewBtn').onclick=()=>mode('view');$('editBtn').onclick=()=>mode('edit');$('sectionBtn').onclick=()=>mode('section');$('copyBtn').onclick=copy;$('todayBtn').onclick=()=>{date.value=iso(new Date());load()};date.onchange=load;$('resetNames').onclick=()=>{if(confirm('項目名と表示設定を初期状態に戻しますか？ 本文は消えません。')){localStorage.removeItem(cfgKey);settings();build();render()}};
$('deleteBtn').onclick=()=>{if(!confirm('日報の保存データをすべて削除しますか？'))return;const a=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(PREFIX))a.push(k)}a.forEach(k=>localStorage.removeItem(k));load()};
const DB='shiftExcelDB',STORE='files',REC='latest';function odb(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function saveX(data,name){const db=await odb();return new Promise((ok,no)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put({data,name,savedAt:new Date().toISOString()},REC);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function loadX(){const db=await odb();return new Promise((ok,no)=>{const t=db.transaction(STORE,'readonly'),r=t.objectStore(STORE).get(REC);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)})}
let rows=null,dates=[],hr=-1,nc=-1,cc=-1;function clean(v){return v==null?'':String(v).trim()}function parseDate(v){if(v instanceof Date&&!isNaN(v))return iso(v);if(typeof v==='number'&&v>30000){const o=XLSX.SSF.parse_date_code(v);if(o)return `${o.y}-${String(o.m).padStart(2,'0')}-${String(o.d).padStart(2,'0')}`}const s=clean(v).replace(/[年月]/g,'/').replace('日','');const m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:null}
function useX(buf,name,savedAt){const wb=XLSX.read(buf,{type:'array',cellDates:true}),sh=wb.Sheets[SHEET_NAME];if(!sh)throw Error('「'+SHEET_NAME+'」シートがありません');rows=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:null});for(let r=0;r<Math.min(100,rows.length);r++){for(let c=0;c<(rows[r]||[]).length;c++)if(clean(rows[r][c]).includes('担当者名')){hr=r;nc=c;break}if(hr>=0)break}if(hr<0)throw Error('担当者名の列が見つかりません');cc=(rows[hr]||[]).findIndex(x=>clean(x)==='CD');if(cc<0)cc=Math.max(0,nc-2);const map=new Map();for(let r=Math.max(0,hr-2);r<=Math.min(rows.length-1,hr+2);r++)for(let c=0;c<(rows[r]||[]).length;c++){const x=parseDate(rows[r][c]);if(x&&!map.has(x))map.set(x,c)}dates=[...map].map(([iso,col])=>({iso,col}));$('savedInfo').textContent=`保存中：${name}${savedAt?'（'+new Date(savedAt).toLocaleString('ja-JP')+'）':''}`;updateShift()}
function updateShift(){selectedShift='';if(!rows){$('shiftInfo').textContent='シフト：読み込み待ち';render();return}const dc=dates.find(x=>x.iso===date.value);if(!dc){$('shiftInfo').textContent='シフト：この日付はシフト表にありません';render();return}for(let r=hr+1;r<rows.length;r++){const n=clean(rows[r]?.[nc]);if(n.includes(SELF)){selectedShift=clean(rows[r]?.[dc.col]);break}}$('shiftInfo').textContent=selectedShift?'シフト：'+selectedShift:'シフト：該当なし';const d=data();if(!d.staffMembers){let st=-1,en=rows.length;for(let r=hr+1;r<rows.length;r++){const n=clean(rows[r]?.[nc]);if(st<0&&n.includes('幸田'))st=r;if(st>=0&&n.includes('茂呂')){en=r;break}}if(st>=0){const a=[];for(let r=st;r<en;r++){const n=clean(rows[r]?.[nc]),s=clean(rows[r]?.[dc.col]);if(n&&s&&!/(休|有休|有給|欠勤|休日|振休|代休)/.test(s))a.push(`${n}　${s}`)}if(a.length){d.staffMembers=a.join('\n');localStorage.setItem(dayKey(),JSON.stringify(d));build()}}}render()}
$('excelFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const b=await f.arrayBuffer();useX(b,f.name);await saveX(b,f.name)}catch(err){alert('読み込みエラー：'+err.message)}e.target.value=''};
date.value=iso(new Date());load();mode('edit');loadX().then(x=>{if(x)useX(x.data,x.name,x.savedAt)}).catch(()=>{});
})();
</script></body></html>
