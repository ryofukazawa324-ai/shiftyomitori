<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>シフト検索</title>

  <!-- SheetJS Community Edition -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }
    .wrap {
      width: min(720px, calc(100% - 28px));
      margin: 28px auto;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 28px rgba(0,0,0,.08);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }
    .sub {
      margin: 0 0 22px;
      color: #6b7280;
      font-size: 14px;
    }
    .field { margin: 16px 0; }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }
    input[type="date"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: white;
      font-size: 16px;
    }
    input[type="file"] { display: none; }
    .fileButton {
      width: 100%;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      display: block;
      background: #eef2f7;
      color: #111827;
    }
    .saved {
      margin: 14px 0;
      padding: 14px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }
    .savedTitle { font-size: 13px; color: #6b7280; margin-bottom: 4px; }
    .savedName { font-weight: 700; word-break: break-all; }
    .savedDate { font-size: 12px; color: #6b7280; margin-top: 4px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #111827;
      color: white;
      margin-top: 6px;
    }
    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f3f4f6;
      font-size: 14px;
      line-height: 1.6;
    }
    .status.ok { background: #ecfdf5; }
    .status.error { background: #fef2f2; }
    .result { margin-top: 24px; }
    .result h2 {
      margin: 0 0 12px;
      font-size: 21px;
    }
    .count {
      color: #6b7280;
      font-size: 14px;
      font-weight: 400;
    }
    .list {
      overflow: hidden;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: white;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 13px 16px;
      border-bottom: 1px solid #eef0f2;
    }
    .row:last-child { border-bottom: 0; }
    .name { font-weight: 700; }
    .shift {
      min-width: 64px;
      text-align: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: #f3f4f6;
      font-weight: 700;
    }
    .empty {
      padding: 22px;
      text-align: center;
      color: #6b7280;
    }
    .note {
      margin-top: 16px;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">
      <h1>シフト検索</h1>
      <p class="sub">Excelシフト表から、指定日のスタッフ名と勤務区分を表示します。</p>

      <div id="savedBox" class="saved" hidden>
        <div class="savedTitle">現在保存中のシフト表</div>
        <div id="savedName" class="savedName"></div>
        <div id="savedDate" class="savedDate"></div>
      </div>

      <label class="fileButton" for="excelFile" id="fileLabel">シフト表を登録</label>
      <input id="excelFile" type="file" accept=".xlsx,.xls,.xlsm">

      <div class="field">
        <label for="targetDate">② 日付</label>
        <input id="targetDate" type="date">
      </div>

      <button id="searchBtn" disabled>この日のシフトを表示</button>

      <div id="status" class="status">Excelファイルを選択してください。</div>

      <div id="result" class="result" hidden>
        <h2 id="resultTitle"></h2>
        <div id="staffList" class="list"></div>
      </div>

      <p class="note">
        シフト表はこの端末のブラウザ内に保存します。次回から自動で読み込みます。
        新しい月のシフトに変える時だけ「シフト表を更新」を押してください。
        Safariのサイトデータを削除した場合などは再登録が必要です。
      </p>
    </section>
  </main>

<script>
(() => {
  const SHEET_NAME = "3）入力用";

  const fileInput = document.getElementById("excelFile");
  const dateInput = document.getElementById("targetDate");
  const searchBtn = document.getElementById("searchBtn");
  const statusBox = document.getElementById("status");
  const resultBox = document.getElementById("result");
  const resultTitle = document.getElementById("resultTitle");
  const staffList = document.getElementById("staffList");

  const DB_NAME = "ShiftSearchDB";
  const DB_VERSION = 1;
  const STORE_NAME = "files";
  const RECORD_KEY = "currentShift";

  const fileLabel = document.getElementById("fileLabel");
  const savedBox = document.getElementById("savedBox");
  const savedName = document.getElementById("savedName");
  const savedDate = document.getElementById("savedDate");

  let workbook = null;
  let rows = null;
  let headerRowIndex = -1;
  let nameColIndex = -1;
  let codeColIndex = -1;
  let dateColumns = [];

  dateInput.value = localISODate(new Date());


  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function saveShiftFile(arrayBuffer, fileName) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).put({
        fileName,
        savedAt: new Date().toISOString(),
        data: arrayBuffer
      }, RECORD_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }

  async function loadSavedShiftFile() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const req = tx.objectStore(STORE_NAME).get(RECORD_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  async function parseAndUse(data, fileName, savedAt = null) {
    workbook = XLSX.read(data, { type: "array", cellDates: true, cellFormula: true });
    const sheet = workbook.Sheets[SHEET_NAME];
    if (!sheet) throw new Error(`「${SHEET_NAME}」シートがありません。`);

    rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: null });
    const layout = findLayout(rows);
    headerRowIndex = layout.headerRow;
    nameColIndex = layout.nameCol;
    codeColIndex = layout.codeCol;
    dateColumns = layout.dates;

    setDateRange(dateColumns);
    searchBtn.disabled = false;

    savedBox.hidden = false;
    savedName.textContent = fileName;
    savedDate.textContent = savedAt
      ? `保存日時：${new Date(savedAt).toLocaleString("ja-JP")}`
      : "";
    fileLabel.textContent = "シフト表を更新";

    const firstDate = dateColumns[0].iso.replaceAll("-", "/");
    const lastDate = dateColumns[dateColumns.length - 1].iso.replaceAll("-", "/");
    setStatus(`保存済みシフトを使用中：${firstDate} ～ ${lastDate}`, "ok");
    showShift();
  }

  function localISODate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function excelSerialToISO(serial) {
    const parsed = XLSX.SSF.parse_date_code(Number(serial));
    if (!parsed) return null;
    return `${parsed.y}-${String(parsed.m).padStart(2,"0")}-${String(parsed.d).padStart(2,"0")}`;
  }

  function valueToISO(value) {
    if (value instanceof Date && !Number.isNaN(value.getTime())) {
      return localISODate(value);
    }

    if (typeof value === "number" && value > 30000 && value < 80000) {
      return excelSerialToISO(value);
    }

    if (typeof value === "string") {
      const s = value.trim();

      // YYYY/M/D, YYYY-M-D
      let m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
      if (m) {
        return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
      }
    }

    return null;
  }

  function isPersonCode(value) {
    if (typeof value === "number") return Number.isFinite(value);
    if (typeof value !== "string") return false;
    return /^\d+$/.test(value.trim());
  }

  function cleanText(value) {
    if (value === null || value === undefined) return "";
    return String(value).trim();
  }

  function setStatus(message, type = "") {
    statusBox.className = `status ${type}`.trim();
    statusBox.textContent = message;
  }

  function findLayout(data) {
    let foundHeader = -1;
    let foundNameCol = -1;
    let foundCodeCol = -1;

    // 「担当者名」を含む行をヘッダーとして探す
    for (let r = 0; r < Math.min(data.length, 100); r++) {
      const row = data[r] || [];
      for (let c = 0; c < row.length; c++) {
        const text = cleanText(row[c]);
        if (text.includes("担当者名")) {
          foundHeader = r;
          foundNameCol = c;
          break;
        }
      }
      if (foundHeader >= 0) break;
    }

    if (foundHeader < 0) {
      throw new Error("「担当者名」の列を見つけられませんでした。");
    }

    // 同じヘッダー行から「CD」列を探す
    const header = data[foundHeader] || [];
    for (let c = 0; c < header.length; c++) {
      if (cleanText(header[c]) === "CD") {
        foundCodeCol = c;
        break;
      }
    }

    // 今回のExcelではCD列がスタッフ行を判定するのに使える
    if (foundCodeCol < 0) {
      foundCodeCol = Math.max(0, foundNameCol - 2);
    }

    // 日付列を探す。
    // ヘッダー行と、その前後2行も見ることで月ごとの微妙なズレに耐える
    const dateMap = new Map();
    const startR = Math.max(0, foundHeader - 2);
    const endR = Math.min(data.length - 1, foundHeader + 2);

    for (let r = startR; r <= endR; r++) {
      const row = data[r] || [];
      for (let c = 0; c < row.length; c++) {
        const iso = valueToISO(row[c]);
        if (iso && !dateMap.has(iso)) {
          dateMap.set(iso, c);
        }
      }
    }

    const foundDates = [...dateMap.entries()]
      .map(([iso, col]) => ({ iso, col }))
      .sort((a, b) => a.iso.localeCompare(b.iso));

    if (!foundDates.length) {
      throw new Error("日付の列を見つけられませんでした。");
    }

    return {
      headerRow: foundHeader,
      nameCol: foundNameCol,
      codeCol: foundCodeCol,
      dates: foundDates
    };
  }

  function setDateRange(dates) {
    const first = dates[0].iso;
    const last = dates[dates.length - 1].iso;
    dateInput.min = first;
    dateInput.max = last;

    const today = localISODate(new Date());
    if (dates.some(d => d.iso === today)) {
      dateInput.value = today;
    } else {
      dateInput.value = first;
    }
  }

  fileInput.addEventListener("change", async () => {
    resultBox.hidden = true;
    searchBtn.disabled = true;

    const file = fileInput.files?.[0];
    if (!file) return;

    try {
      setStatus("Excelを読み込んでいます…");
      const data = await file.arrayBuffer();

      await parseAndUse(data, file.name);
      await saveShiftFile(data, file.name);

      const now = new Date();
      savedDate.textContent = `保存日時：${now.toLocaleString("ja-JP")}`;
      setStatus("シフト表を保存しました。次回から自動で読み込みます。", "ok");
    } catch (err) {
      console.error(err);
      setStatus(`読み込みエラー：${err.message}`, "error");
    } finally {
      fileInput.value = "";
    }
  });

  searchBtn.addEventListener("click", showShift);
  dateInput.addEventListener("change", () => {
    if (rows) showShift();
  });

  function showShift() {
    if (!rows) return;

    const target = dateInput.value;
    const dateInfo = dateColumns.find(d => d.iso === target);

    if (!dateInfo) {
      resultBox.hidden = false;
      resultTitle.textContent = "該当する日付がありません";
      staffList.innerHTML = `<div class="empty">このExcelには ${target} の列がありません。</div>`;
      return;
    }

    const staff = [];

    for (let r = headerRowIndex + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const name = cleanText(row[nameColIndex]);
      const code = row[codeColIndex];
      const shift = cleanText(row[dateInfo.col]);

      // スタッフ名があり、CDが数値の実スタッフ行だけ対象
      if (!name || !isPersonCode(code)) continue;

      // 勤務区分が空欄なら、その日は一覧に出さない
      if (!shift) continue;

      // 明確な休暇・休日表記は「出勤スタッフ」から除外
      const leaveWords = [
        "休", "公休", "有休", "有給", "希望休",
        "欠勤", "休日", "振休", "代休"
      ];
      if (leaveWords.some(word => shift === word || shift.includes(word))) continue;

      staff.push({ name, shift });
    }

    const d = new Date(`${target}T00:00:00`);
    const weekday = ["日","月","火","水","木","金","土"][d.getDay()];
    const title = `${d.getMonth()+1}月${d.getDate()}日（${weekday}）の出勤スタッフ`;

    resultTitle.innerHTML = `${title} <span class="count">${staff.length}名</span>`;
    resultBox.hidden = false;

    if (!staff.length) {
      staffList.innerHTML = `<div class="empty">勤務が入っているスタッフが見つかりませんでした。</div>`;
      return;
    }

    staffList.innerHTML = staff.map(person => `
      <div class="row">
        <div class="name">${escapeHTML(person.name)}</div>
        <div class="shift">${escapeHTML(person.shift)}</div>
      </div>
    `).join("");
  }

  function escapeHTML(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  // ページを開いたとき、前回保存したExcelを自動読込
  (async () => {
    try {
      const saved = await loadSavedShiftFile();
      if (!saved) {
        setStatus("初回だけ、シフト表Excelを登録してください。");
        return;
      }
      await parseAndUse(saved.data, saved.fileName, saved.savedAt);
    } catch (err) {
      console.error(err);
      setStatus("保存済みシフトを読み込めませんでした。シフト表を再登録してください。", "error");
    }
  })();

})();
</script>
</body>
</html>
