<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日報ダッシュボード</title>
</head>
<body>
  <div id="loading" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px;">最新版を読み込んでいます…</div>
  <script>
  (async () => {
    try {
      const res = await fetch(`app.html?_fresh=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const html = await res.text();
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      document.getElementById('loading').innerHTML = '読み込みに失敗しました。通信状態を確認して、もう一度開いてください。';
      console.error(e);
    }
  })();
  </script>
</body>
</html>
