<!doctype html>
<html lang="ja">
<head>
<link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/ryofukazawa324-ai/shiftyomitori/d909b77642a4fb5cc676ef944cdcddc3d78e8fd8/apple-touch-icon.png">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ryofukazawa324-ai/shiftyomitori/d909b77642a4fb5cc676ef944cdcddc3d78e8fd8/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日報作成">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>日報ダッシュボード</title>
  <link rel="preconnect" href="https://cdn.sheetjs.com" crossorigin>
  <style>
    * { box-sizing: border-box; }
    html { min-height:100%; overflow-x:hidden; }
    body { margin:0; min-height:100%; overflow-x:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; background:#f4f6f8; color:#1f2937; }
    .wrap { width:min(720px,calc(100% - 28px)); margin:22px auto; padding-bottom:calc(180px + env(safe-area-inset-bottom)); }
    .card { background:#fff; border-radius:18px; padding:18px; box-shadow:0 10px 30px rgba(0,0,0,.07); }
    h1 { margin:0 0 6px; font-size:25px; }
    .sub,.small { color:#6b7280; font-size:12px; line-height:1.55; }
    .dateRow { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:end; margin:16px 0; }
    label { font-size:13px; }
    input,textarea,button { font:inherit; }
    input[type=date],input[type=text],input[type=number],textarea { width:100%; border:1px solid #d1d5db; border-radius:10px; padding:11px; background:#fff; }
    textarea { min-height:86px; resize:vertical; }
    button,.fileButton { border:0; border-radius:10px; padding:11px 13px; background:#111827; color:#fff; font-weight:700; cursor:pointer; text-align:center; }
    .reportHeader { padding:13px 14px; background:#111827; color:#fff; border-radius:12px; font-weight:800; }
    .shiftInfo { margin:7px 0 12px; color:#6b7280; font-size:13px; }
    .topbar { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:14px 0; }
    .modeBtn { background:#eef2f7; color:#111827; padding:11px 6px; }
    .modeBtn.active { background:#111827; color:#fff; }
    .sectionCard { margin:12px 0; padding:15px; border:1px solid #e5e7eb; border-radius:14px; background:#fff; }
    .sectionCard h3 { margin:0 0 10px; font-size:17px; }
    .sectionHead { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .twoCol { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .viewBox { white-space:pre-wrap; line-height:1.75; border:1px solid #e5e7eb; border-radius:14px; padding:15px; }
    .copyBtn { width:100%; margin-top:12px; }
    .monthlyFbBtn { width:100%; margin:14px 0 2px; background:#0f766e; }
    .fileButton { display:block; background:#eef2f7; color:#111827; margin-top:10px; }
    input[type=file] { display:none; }
    .status { margin-top:9px; font-size:12px; color:#6b7280; }
    .status.ok { color:#047857; } .status.error { color:#b91c1c; }
    .saved { margin:8px 0; padding:10px; border-radius:10px; background:#f8fafc; }
    .savedTitle { font-size:12px; color:#6b7280; } .savedName { font-weight:700; }
    .settingsRow { display:grid; grid-template-columns:1fr auto auto; gap:7px; align-items:center; padding:9px 0; border-bottom:1px solid #eee; }
    .sectionNameWrap { position:relative; }
    .sectionNameWrap::before { content:"◆"; position:absolute; left:11px; top:50%; transform:translateY(-50%); font-weight:800; }
    .sectionNameWrap input { padding-left:30px; }
    .orderBtns { display:flex; gap:4px; }
    .orderBtn { padding:8px 10px; background:#eef2f7; color:#111827; }
    .orderBtn:disabled { opacity:.35; }
    .showLabel { white-space:nowrap; font-size:12px; }
    .customSettings { margin-top:14px; }
    .customRow { display:grid; grid-template-columns:1fr auto auto; gap:7px; align-items:center; padding:8px 0; }
    .removeBtn { background:#fff1f2; color:#b91c1c; padding:8px 10px; }
    .danger { width:100%; margin-top:18px; background:#fff; color:#b91c1c; border:1px solid #fecaca; }
    @media(max-width:560px){ .twoCol{grid-template-columns:1fr} .settingsRow,.customRow{grid-template-columns:1fr auto} .settingsRow .showLabel{grid-column:1/3} }
  </style>
</head>
<body>
<main class="wrap"><section class="card">
  <h1>日報ダッシュボード</h1>
  <div class="sub">日付ごとに編集・保存。項目名と順番も変更できます。</div>
  <div class="dateRow"><div><label for="targetDate">日付</label><input id="targetDate" type="date"></div><button id="todayBtn" type="button">今日</button></div>
  <div id="reportHeader" class="reportHeader"></div><div id="shiftInfo" class="shiftInfo">シフト：読み込み待ち</div>
  <div class="topbar"><button id="viewModeBtn" class="modeBtn">表示モード</button><button id="editModeBtn" class="modeBtn active">編集モード</button><button id="sectionModeBtn" class="modeBtn">項目変更</button></div>
  <section id="viewMode" hidden><div id="viewText" class="viewBox"></div><button id="copyBtn" class="copyBtn">全文をコピー</button></section>
  <section id="sectionMode" hidden><div class="sectionCard"><h3>◆項目変更モード</h3><div class="small">◆は自動で付きます。項目名・表示/非表示・並び順を変更できます。本文データは消えません。</div><div id="sectionSettings"></div><button id="addSectionFromSettingsBtn" class="copyBtn">＋ 項目を追加</button></div></section>
  <section id="editMode"></section>
  <button id="monthlyFbBtn" class="monthlyFbBtn" type="button">この月のFBをChatGPTにお願い</button>
  <div class="small" style="text-align:center;margin:6px 0 14px">選択中の月に保存されている日報をまとめてコピーします</div>
  <div class="sectionCard"><h3>シフト表</h3><div id="savedBox" class="saved" hidden><div class="savedTitle">現在保存中のシフト表</div><div id="savedName" class="savedName"></div><div id="savedDate" class="small"></div></div><label class="fileButton" for="excelFile" id="fileLabel">シフト表を登録</label><input id="excelFile" type="file" accept=".xlsx,.xls,.xlsm"><div id="status" class="status">初回だけシフト表Excelを登録してください。</div></div>
  <div class="sectionCard"><h3>端末引き継ぎ</h3><div class="small">日報・設定・保存済みシフト表を1つのファイルにまとめて移せます。</div><button id="exportBackupBtn" class="copyBtn" type="button">引き継ぎデータを書き出す</button><label class="fileButton" for="importBackupFile">引き継ぎデータを読み込む</label><input id="importBackupFile" type="file" accept=".json,application/json"><div id="backupStatus" class="status"></div></div>
  <button id="deleteReportDataBtn" class="danger">日報の保存データを削除</button>
</section></main>
<script>
(()=>{
const SHEET_NAME="3）入力用",SELF="深澤",DISPLAY="深澤椋",PREFIX="workReport:";
const DEFAULTS={monthlyGoal:"販買以外の業務を部門でできるようにしていく\nお客様に向かう行動を常にしタイミングに振り回されないようにする",dailyTodo:"pos点検、退勤時AV情報POS締め",earlyTodo:"ゲーム在庫確認、展示デモオンPCコーナーからゲームコーナー前レジ横のモニター左右まで\npcコーナーpop更新、古物確認",lateTodo:"デモオフ"};
const defs=[["staffMembers","出勤メンバー","text"],["monthlyGoal","今月目標","month"],["dailyTodo","本日のやること","text"],["earlyTodo","早番todo","text"],["lateTodo","遅番todo","text"],["beforeGoal","出勤前目標","text"],["sales","販買実績","sales"],["bbSurvey","BBアンケート","text"],["oneWord","ヒトコト所感","text"],["improve","改善期待行動","text"],["stumble","まごついたところ","text"],["impression","所感","text"]];
const ids=defs.map(x=>x[0]),legacy=["staffMembers","dailyTodo","earlyTodo","lateTodo","beforeGoal","virtualOrder","salesModels","bbSurvey","oneWord","improve","stumble","impression"],$=id=>document.getElementById(id),date=$("targetDate"),edit=$("editMode"),view=$("viewMode"),sec=$("sectionMode");let selectedShift="",rows=null,headerRowIndex=-1,nameColIndex=-1,codeColIndex=-1,dateColumns=[];
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)},dayKey=()=>`${PREFIX}day:${date.value}`,monthKey=()=>`${PREFIX}month:${date.value.slice(0,7)}`,cfgKey=`${PREFIX}sectionConfig`,orderKey=`${PREFIX}sectionOrder`,customKey=()=>`${dayKey()}:customSections`,layoutKey=()=>`${dayKey()}:layoutOrder`;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function weekdays(){if(!date.value)return[];const w=new Date(date.value+'T00:00:00').getDay(),a=[];if(w===1)a.push('自主棚');if(w===3)a.push('ゲームダミー準備確認');if(w===4)a.push('ゲーム発売できるように','OODA更新');if(w===5)a.push('18:30くらいから上貼りがある時ある','MK調査');if(w===6)a.push('MK調査','BB濱崎シート確認');return a}
function blank(){return{staffMembers:'',dailyTodo:[DEFAULTS.dailyTodo,...weekdays()].join('\n'),earlyTodo:DEFAULTS.earlyTodo,lateTodo:DEFAULTS.lateTodo,beforeGoal:'',virtualOrder:'',salesModels:'',bbSurvey:'',oneWord:'',improve:'',stumble:'',impression:''}}function data(){try{return{...blank(),...JSON.parse(localStorage.getItem(dayKey())||'{}')}}catch{return blank()}}
function cfg(){let s={};try{s=JSON.parse(localStorage.getItem(cfgKey)||'{}')}catch{};return Object.fromEntries(defs.map(d=>[d[0],{title:String(s[d[0]]?.title||d[1]).replace(/^◆+/,''),hidden:!!s[d[0]]?.hidden}]))}function order(){try{const a=JSON.parse(localStorage.getItem(orderKey)||'[]');return[...a.filter(x=>ids.includes(x)),...ids.filter(x=>!a.includes(x))]}catch{return[...ids]}}function title(id){return cfg()[id]?.title||id}function visible(id){return !cfg()[id]?.hidden}function customs(){try{return JSON.parse(localStorage.getItem(customKey())||'[]')}catch{return[]}}function combinedOrder(){const c=customs(),valid=[...order().map(id=>'s:'+id),...c.map((_,i)=>'c:'+i)];let a=[];try{a=JSON.parse(localStorage.getItem(layoutKey())||'[]')}catch{};a=a.filter(x=>valid.includes(x));return[...a,...valid.filter(x=>!a.includes(x))]}function saveCombined(a){localStorage.setItem(layoutKey(),JSON.stringify(a));localStorage.setItem(orderKey,JSON.stringify(a.filter(x=>x.startsWith('s:')).map(x=>x.slice(2))))}
function save(){const d=data();legacy.forEach(id=>{const e=$(id);if(e)d[id]=e.value});if(document.activeElement&&document.activeElement.id==='staffMembers')d.staffMembersManual=true;localStorage.setItem(dayKey(),JSON.stringify(d));render()}
function build(){const d=data(),cs=customs();let h='';for(const tok of combinedOrder()){if(tok.startsWith('c:')){const i=+tok.slice(2),x=cs[i];if(!x)continue;h+=`<div class="sectionCard"><h3>◆${esc(String(x.title||'新しい項目').replace(/^◆+/,''))}</h3><textarea data-cb="${i}">${esc(x.body||'')}</textarea></div>`;continue}const id=tok.slice(2);if(!visible(id))continue;if(id==='earlyTodo'&&!selectedShift.includes('早'))continue;if(id==='lateTodo'&&!isLateShift(selectedShift))continue;h+=`<div class="sectionCard"><div class="sectionHead"><h3>◆${esc(title(id))}</h3></div>`;if(id==='sales')h+=`<div class="twoCol"><div><div class="small">仮想受注込 → 万円</div><input id="virtualOrder" type="number"></div><div><div class="small">販買商品型番</div><textarea id="salesModels"></textarea></div></div>`;else h+=`<textarea id="${id}"></textarea>`;h+='</div>'}h+='<button id="editCopyBtn" class="copyBtn">全文をコピー</button>';edit.innerHTML=h;legacy.forEach(id=>{const e=$(id);if(e){e.value=d[id]??'';e.oninput=save}});if($("monthlyGoal")){ $("monthlyGoal").value=localStorage.getItem(monthKey())??DEFAULTS.monthlyGoal;$("monthlyGoal").oninput=()=>{localStorage.setItem(monthKey(),$("monthlyGoal").value);render()}}edit.querySelectorAll('[data-cb]').forEach(e=>e.oninput=()=>{const a=customs();a[+e.dataset.cb].body=e.value;localStorage.setItem(customKey(),JSON.stringify(a));render()});$("editCopyBtn").onclick=copy}
function render(){const d=data(),dt=new Date(date.value+'T00:00:00'),o=[`${dt.getMonth()+1}月${dt.getDate()}日　ミッテン府中店　情報部門　${DISPLAY}`],cs=customs();const val=id=>id==='monthlyGoal'?(localStorage.getItem(monthKey())??DEFAULTS.monthlyGoal):id==='sales'?`　仮想受注込　　　→　${d.virtualOrder||''}万円\n　販買商品型番　→　${d.salesModels||''}`:id==='bbSurvey'?`${d.bbSurvey||''}件`:d[id]||'';for(const tok of combinedOrder()){if(tok.startsWith('c:')){const x=cs[+tok.slice(2)];if(x)o.push('',`◆${String(x.title||'新しい項目').replace(/^◆+/,'')}`,x.body||'');continue}const id=tok.slice(2);if(!visible(id))continue;if(id==='earlyTodo'&&!selectedShift.includes('早'))continue;if(id==='lateTodo'&&!isLateShift(selectedShift))continue;o.push('',`◆${title(id)}`,val(id))}$("viewText").textContent=o.join('\n').trim()}
function settings(){const c=cfg(),cs=customs(),a=combinedOrder();$("sectionSettings").innerHTML=a.map((tok,i)=>{if(tok.startsWith('c:')){const n=+tok.slice(2),x=cs[n];if(!x)return'';return`<div class="customRow"><div class="sectionNameWrap"><input data-cn="${n}" value="${esc(String(x.title||'新しい項目').replace(/^◆+/,''))}"></div><div class="orderBtns"><button class="orderBtn" data-move="${tok}" data-dir="-1" ${i===0?'disabled':''}>↑</button><button class="orderBtn" data-move="${tok}" data-dir="1" ${i===a.length-1?'disabled':''}>↓</button></div><button class="removeBtn" data-cr="${n}">削除</button></div>`}const id=tok.slice(2);return`<div class="settingsRow"><div class="sectionNameWrap"><input data-name="${id}" value="${esc(c[id].title)}"></div><div class="orderBtns"><button class="orderBtn" data-move="${tok}" data-dir="-1" ${i===0?'disabled':''}>↑</button><button class="orderBtn" data-move="${tok}" data-dir="1" ${i===a.length-1?'disabled':''}>↓</button></div><label class="showLabel"><input type="checkbox" data-show="${id}" ${c[id].hidden?'':'checked'}> 表示</label></div>`}).join('');$("sectionSettings").querySelectorAll('[data-name]').forEach(e=>e.oninput=()=>{const x=cfg();x[e.dataset.name].title=String(e.value).replace(/^◆+/,'');localStorage.setItem(cfgKey,JSON.stringify(x));build();render()});$("sectionSettings").querySelectorAll('[data-show]').forEach(e=>e.onchange=()=>{const x=cfg();x[e.dataset.show].hidden=!e.checked;localStorage.setItem(cfgKey,JSON.stringify(x));build();render()});$("sectionSettings").querySelectorAll('[data-cn]').forEach(e=>e.oninput=()=>{const x=customs();x[+e.dataset.cn].title=String(e.value).replace(/^◆+/,'');localStorage.setItem(customKey(),JSON.stringify(x));build();render()});$("sectionSettings").querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>moveAny(b.dataset.move,+b.dataset.dir));$("sectionSettings").querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>removeCustom(+b.dataset.cr))}
function moveAny(tok,d){const a=combinedOrder(),i=a.indexOf(tok),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];saveCombined(a);settings();build();render()}
function removeCustom(n){const x=customs();x.splice(n,1);localStorage.setItem(customKey(),JSON.stringify(x));const a=combinedOrder().filter(t=>t!==`c:${n}`).map(t=>t.startsWith('c:')&&+t.slice(2)>n?`c:${+t.slice(2)-1}`:t);saveCombined(a);settings();build();render()}
$("addSectionFromSettingsBtn").onclick=()=>{const a=customs();a.push({title:'新しい項目',body:''});localStorage.setItem(customKey(),JSON.stringify(a));const x=combinedOrder();const tok=`c:${a.length-1}`;if(!x.includes(tok))x.push(tok);saveCombined(x);settings();build();render()};function header(){const d=new Date(date.value+'T00:00:00');$("reportHeader").textContent=`${d.getMonth()+1}月${d.getDate()}日　ミッテン府中店　情報部門　${DISPLAY}`}function load(){header();build();render();updateShift()}
async function copy(){render();try{await navigator.clipboard.writeText($("viewText").textContent);alert('全文をコピーしました')}catch{alert('コピーできませんでした。表示モードから長押しコピーしてください。')}}function mode(m){view.hidden=m!=='view';edit.hidden=m!=='edit';sec.hidden=m!=='section';$("viewModeBtn").classList.toggle('active',m==='view');$("editModeBtn").classList.toggle('active',m==='edit');$("sectionModeBtn").classList.toggle('active',m==='section');if(m==='view')render();if(m==='section')settings()}$("viewModeBtn").onclick=()=>mode('view');$("editModeBtn").onclick=()=>mode('edit');$("sectionModeBtn").onclick=()=>mode('section');$("copyBtn").onclick=copy;$("todayBtn").onclick=()=>{date.value=iso(new Date());load()};date.onchange=load;
function monthlyFeedbackPrompt(){const month=date.value.slice(0,7),[year,mon]=month.split('-').map(Number),goal=localStorage.getItem(`${PREFIX}month:${month}`)??DEFAULTS.monthlyGoal,days=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith(`${PREFIX}day:${month}-`)||k.includes(':customSections'))continue;const day=k.slice(`${PREFIX}day:`.length);try{const d=JSON.parse(localStorage.getItem(k)||'{}');days.push({day,d})}catch{}}days.sort((a,b)=>a.day.localeCompare(b.day));if(!days.length)return null;const c=cfg(),name=id=>c[id]?.title||defs.find(x=>x[0]===id)?.[1]||id;const blocks=days.map(({day,d})=>{const dt=new Date(day+'T00:00:00'),out=[`【${mon}月${dt.getDate()}日】`];const add=(id,v)=>{if(String(v??'').trim())out.push(`◆${name(id)}\n${String(v).trim()}`)};add('beforeGoal',d.beforeGoal);if(String(d.virtualOrder??'').trim()||String(d.salesModels??'').trim())out.push(`◆${name('sales')}\n仮想受注込：${d.virtualOrder||''}万円\n販買商品型番：${d.salesModels||''}`);add('bbSurvey',String(d.bbSurvey??'').trim()?`${d.bbSurvey}件`:'');add('oneWord',d.oneWord);add('improve',d.improve);add('stumble',d.stumble);add('impression',d.impression);try{const cs=JSON.parse(localStorage.getItem(`${PREFIX}day:${day}:customSections`)||'[]');cs.forEach(x=>{if(String(x.body||'').trim())out.push(`◆${String(x.title||'追加項目').replace(/^◆+/,'')}\n${String(x.body).trim()}`)})}catch{}return out.join('\n')}).filter(Boolean);return `以下は${year}年${mon}月の個別日報です。1か月分を通してフィードバックしてください。\n\n特に、\n・今月目標に対してできていたこと／不足していたこと\n・繰り返し出ている強みや良い行動\n・繰り返し出ている課題や改善点\n・育成、周囲への働きかけ、部門全体を見る行動の変化\n・販売面と業務面のバランス\n・翌月に重点的に取り組む行動を3つ\n・上司から見た時に評価されやすい点／改善すると評価につながりそうな点\nを、日報の具体例を拾いながら分析してください。単日の添削ではなく、1か月の傾向として見てください。\n\n【今月目標】\n${goal}\n\n【保存日報：${days.length}日分】\n\n${blocks.join('\n\n--------------------\n\n')}`}
$("monthlyFbBtn").onclick=async()=>{const prompt=monthlyFeedbackPrompt();if(!prompt){alert('選択中の月に保存済みの日報がありません。');return}try{await navigator.clipboard.writeText(prompt);alert('月間FB用の文章をコピーしました。このChatGPTの会話に戻って貼り付けて送信してください。')}catch(e){alert('コピーできませんでした。Safariでページを開き直してもう一度試してください。')}};
const file=$("excelFile"),fileLabel=$("fileLabel"),savedBox=$("savedBox"),savedName=$("savedName"),savedDate=$("savedDate"),status=$("status");const DB='ShiftSearchDB',STORE='files',REC='currentShift',PARSED='currentShiftParsed';function odb(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function saveX(data,name){const db=await odb();return new Promise((ok,no)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put({data,fileName:name,savedAt:new Date().toISOString()},REC);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function loadX(){const db=await odb();return new Promise((ok,no)=>{const t=db.transaction(STORE,'readonly'),r=t.objectStore(STORE).get(REC);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)})}async function putXRecord(v){const db=await odb();return new Promise((ok,no)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,REC);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function saveParsed(v){const db=await odb();return new Promise((ok,no)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,PARSED);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function loadParsed(){const db=await odb();return new Promise((ok,no)=>{const t=db.transaction(STORE,'readonly'),r=t.objectStore(STORE).get(PARSED);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)})}
function abToB64(buf){const bytes=new Uint8Array(buf),chunk=0x8000;let out='';for(let i=0;i<bytes.length;i+=chunk)out+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(out)}
function b64ToAb(s){const bin=atob(s),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a.buffer}
async function exportBackup(){const st=$('backupStatus');try{st.textContent='引き継ぎデータを作成しています…';const storage={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(PREFIX))storage[k]=localStorage.getItem(k)}const x=await loadX();const backup={app:'shiftyomitori',version:1,exportedAt:new Date().toISOString(),localStorage:storage,shift:null};if(x&&x.data)backup.shift={fileName:x.fileName||'shift.xlsx',savedAt:x.savedAt||null,data:abToB64(x.data)};const blob=new Blob([JSON.stringify(backup)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`日報引き継ぎ_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);st.textContent='書き出しました。新しい端末でこのファイルを読み込んでください。'}catch(e){st.textContent=`書き出しエラー：${e.message}`}}
async function importBackup(f){const st=$('backupStatus');try{st.textContent='引き継ぎデータを読み込んでいます…';const b=JSON.parse(await f.text());if(b?.app!=='shiftyomitori'||!b.localStorage)throw Error('このアプリの引き継ぎファイルではありません');for(const [k,v] of Object.entries(b.localStorage))if(k.startsWith(PREFIX))localStorage.setItem(k,String(v));if(b.shift?.data){const rec={data:b64ToAb(b.shift.data),fileName:b.shift.fileName||'shift.xlsx',savedAt:b.shift.savedAt||new Date().toISOString()};await putXRecord(rec);const parsed=await parse(rec.data,rec.fileName,rec.savedAt);await saveParsed(parsed)}st.textContent='引き継ぎが完了しました。';load();alert('引き継ぎが完了しました')}catch(e){st.textContent=`読み込みエラー：${e.message}`}}
let xp=null;function ensureX(){if(window.XLSX)return Promise.resolve();if(xp)return xp;xp=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.async=true;s.onload=ok;s.onerror=no;document.head.appendChild(s)});return xp}function clean(v){return v==null?'':String(v).trim()}function toISO(v){if(v instanceof Date&&!isNaN(v))return iso(v);if(typeof v==='number'&&v>30000&&v<80000&&window.XLSX){const p=XLSX.SSF.parse_date_code(v);if(p?.y)return `${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`}const m=clean(v).match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);return m?`${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`:null}function layout(a){let hr=-1,nc=-1,cc=-1;for(let r=0;r<Math.min(a.length,60);r++){for(let c=0;c<(a[r]||[]).length;c++)if(clean(a[r][c]).includes('担当者名')){hr=r;nc=c;break}if(hr>=0)break}if(hr<0)throw Error('担当者名の列が見つかりません');for(let c=0;c<(a[hr]||[]).length;c++)if(clean(a[hr][c])==='CD')cc=c;if(cc<0)cc=Math.max(0,nc-2);const m=new Map(),header=a[hr]||[];for(let c=0;c<header.length;c++){const z=toISO(header[c]);if(z&&!m.has(z))m.set(z,c)}if(!m.size){for(let r=Math.max(0,hr-2);r<=Math.min(a.length-1,hr+2);r++)for(let c=0;c<(a[r]||[]).length;c++){const z=toISO(a[r][c]);if(z&&!m.has(z))m.set(z,c)}}const dates=[...m].map(([iso,col])=>({iso,col})).sort((x,y)=>x.iso.localeCompare(y.iso));if(!dates.length)throw Error('日付列が見つかりません');return{hr,nc,cc,dates}}async function parse(data,name,at){await ensureX();const wb=XLSX.read(data,{type:'array',cellDates:true}),sh=wb.Sheets[SHEET_NAME];if(!sh)throw Error('シートがありません');rows=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:null});const l=layout(rows);headerRowIndex=l.hr;nameColIndex=l.nc;codeColIndex=l.cc;dateColumns=l.dates;savedBox.hidden=false;savedName.textContent=name;savedDate.textContent=at?`保存日時：${new Date(at).toLocaleString('ja-JP')}`:'';fileLabel.textContent='シフト表を更新';status.textContent=`保存済みシフトを使用中（${dateColumns[0]?.iso||'?'} ～ ${dateColumns.at(-1)?.iso||'?'}）`;updateShift();return{rows,headerRowIndex,nameColIndex,codeColIndex,dateColumns,fileName:name,savedAt:at}}
function isOffShift(v){const x=clean(v);return !x||['休','公','有','年','欠','休み','公休','有休','有給','年休','欠勤'].some(k=>x===k||x.includes(k))}
function isLateShift(v){const x=clean(v);return x.includes('遅')||/20\s*[:：]?\s*30/.test(x)}
function selfShiftAt(day){const di=dateColumns.find(x=>x.iso===day);if(!di||!rows)return null;for(let r=headerRowIndex+1;r<rows.length;r++){const row=rows[r]||[],name=clean(row[nameColIndex]);if(name.includes(SELF))return clean(row[di.col])}return null}
function applyScheduledTodos(d){const dt=new Date(date.value+'T00:00:00'),w=dt.getDay();let addAdmin=false;if(w===1&&!isOffShift(selectedShift))addAdmin=true;else if(w===2){const m=new Date(dt);m.setDate(m.getDate()-1);const mon=selfShiftAt(iso(m));if(mon!==null&&isOffShift(mon))addAdmin=true}if(addAdmin&&!String(d.dailyTodo||'').split(/\r?\n/).map(x=>x.trim()).includes('庶務発注'))d.dailyTodo=[d.dailyTodo,'庶務発注'].filter(Boolean).join('\n')}
function updateShift(){selectedShift='';if(!rows){$("shiftInfo").textContent='シフト：読み込み待ち';build();render();return}const di=dateColumns.find(x=>x.iso===date.value);if(!di){$("shiftInfo").textContent='シフト：この日付はシフト表にありません';build();render();return}let start=-1,end=-1;for(let r=headerRowIndex+1;r<rows.length;r++){const name=clean((rows[r]||[])[nameColIndex]);if(start<0&&name.includes('幸田'))start=r;if(start>=0&&name.includes('小西')){end=r;break}}if(start<0)start=headerRowIndex+1;if(end<start)end=Math.min(rows.length-1,start+30);const members=[];for(let r=start;r<=end;r++){const row=rows[r]||[],name=clean(row[nameColIndex]),shift=clean(row[di.col]);if(!name||name.includes('茂呂'))continue;if(name.includes(SELF))selectedShift=shift;if(shift&&!['休','公','有','年','欠','休み','公休','有休','有給','年休','欠勤'].includes(shift))members.push(`${name}　${shift}`)}for(let r=headerRowIndex+1;r<rows.length;r++){const row=rows[r]||[],name=clean(row[nameColIndex]),shift=clean(row[di.col]);if(name.includes('孫立淳')&&shift&&!['休','公','有','年','欠','休み','公休','有休','有給','年休','欠勤'].includes(shift)&&!members.some(x=>x.startsWith('孫立淳　')))members.push(`${name}　${shift}`)}const d=data();applyScheduledTodos(d);if(!d.staffMembersManual)d.staffMembers=members.join('\n');localStorage.setItem(dayKey(),JSON.stringify(d));$("shiftInfo").textContent=selectedShift?`シフト：${selectedShift}`:'シフト：該当なし';build();render()}
$('exportBackupBtn').onclick=exportBackup;$('importBackupFile').onchange=async e=>{const f=e.target.files?.[0];if(f)await importBackup(f);e.target.value=''};file.onchange=async()=>{const f=file.files?.[0];if(!f)return;try{status.textContent='Excelを読み込んでいます…';const a=await f.arrayBuffer();const parsed=await parse(a,f.name);await saveX(a,f.name);await saveParsed(parsed);status.textContent=`シフト表を保存しました（${dateColumns[0]?.iso||'?'} ～ ${dateColumns.at(-1)?.iso||'?'}）。次回から自動で読み込みます。`}catch(e){status.textContent=`読み込みエラー：${e.message}`}finally{file.value=''}};$("deleteReportDataBtn").onclick=()=>{if(!confirm('日報の保存データをすべて削除しますか？'))return;const a=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith(PREFIX))a.push(k)}a.forEach(k=>localStorage.removeItem(k));load()};date.value=iso(new Date());load();mode('edit');const deferred=async()=>{try{const c=await loadParsed();if(c&&c.rows&&c.dateColumns){rows=c.rows;headerRowIndex=c.headerRowIndex;nameColIndex=c.nameColIndex;codeColIndex=c.codeColIndex;dateColumns=c.dateColumns;savedBox.hidden=false;savedName.textContent=c.fileName||'保存済みシフト表';savedDate.textContent=c.savedAt?`保存日時：${new Date(c.savedAt).toLocaleString('ja-JP')}`:'';fileLabel.textContent='シフト表を更新';status.textContent=`保存済みシフトを使用中（${dateColumns[0]?.iso||'?'} ～ ${dateColumns.at(-1)?.iso||'?'}）`;updateShift();return}const x=await loadX();if(x){const parsed=await parse(x.data,x.fileName,x.savedAt);await saveParsed(parsed)}}catch{}};if('requestIdleCallback'in window)requestIdleCallback(deferred,{timeout:1500});else setTimeout(deferred,100);
})();
